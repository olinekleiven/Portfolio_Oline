            // half its horizontal travel, so long flat sweeps draw slowly
            // instead of racing across the page in a few px of scroll.
            if (prev) eff.push(eff[eff.length - 1] + Math.max(Math.abs(pt.y - prev.y), Math.abs(pt.x - prev.x) * 0.5));
            prev = pt;
          }
          els.forEach(e => e.classList.add('scroll-line'));
          pieces.push({ els, ys, eff, finale: byKey[els[0].dataset.threadPiece] && byKey[els[0].dataset.threadPiece].finale });
        };
        THREAD_SECTIONS.forEach(id => {
          // The measured path first, then its cord layers (see ThreadStroke)
          const layers = key => [...document.querySelectorAll(`[data-thread-layer="${key}"]`)];
          const line = document.querySelector(`[data-thread="${id}"]`);
          if (line) addPiece([line, ...layers(`line:${id}`)]);
          if (byKey[id]) addPiece([...document.querySelectorAll(`[data-thread-piece="${id}"]`), ...layers(`piece:${id}`)]);
        });
        // Fraction of a piece drawn when the tip is at page-y `tip`: the tip's
        // distance past the piece's start, spent along its scroll-cost curve.
        const fracAt = (p, tip) => {
          const d = tip - p.ys[0], eff = p.eff;
          if (d <= 0) return 0;
          for (let i = 1; i < eff.length; i++) {
            if (eff[i] >= d) {
              const t = (d - eff[i - 1]) / ((eff[i] - eff[i - 1]) || 1);
              return (i - 1 + t) / (eff.length - 1);
            }
          }
          return 1;
        };
        const introState = introRef.current;
        const g = gameRef.current;
        const playing = !reducedMotion;
        // Each knot caps the tip for its own piece and every piece after it,
        // at the page-y where the drawing reaches the knot. Once untied, the
        // cap slides on down at a steady pace so the thread visibly carries on.
        const knots = playing ? (threads.knots || []).map(k => {
          const idx = pieces.findIndex(p => p.els[0].dataset.threadPiece === k.key);
          if (idx < 0) return null;
          const p = pieces[idx], f = k.at * (p.eff.length - 1), i = Math.floor(f);
          const e = p.eff[i] + ((p.eff[i + 1] ?? p.eff[i]) - p.eff[i]) * (f - i);
          return { ...k, idx, tipY: p.ys[0] + e, el: document.querySelector(`[data-knot="${k.key}"]`) };
        }).filter(Boolean) : [];
        const noteEls = {
          intro1: document.querySelector('[data-thread-note="intro1"]'),
          intro2: document.querySelector('[data-thread-note="intro2"]'),
        };
        const chip = document.querySelector('[data-thread-chip]');
        const RELEASE_DELAY = 550, RELEASE_SPEED = 1.3; // ms after untie, px of tip per ms
        let rafId = null, gatherTimer = null;
        const apply = () => {
          rafId = null;
          const now = performance.now();
          let animating = false;
          const tip = reducedMotion ? Infinity : window.scrollY + window.innerHeight * 0.75 * introState.value;
          const limits = knots.map(k => {
            const t0 = g.untied[k.key];
            if (t0 === undefined) return k.tipY;
            const lim = k.tipY + Math.max(0, now - t0 - RELEASE_DELAY) * RELEASE_SPEED;
            if (lim < tip) animating = true;
            return lim;
          });
          // Finale: once gathered, everything reels in towards the ball
          let reel = 0;
          if (g.gathered !== null) {
            const r = Math.max(0, Math.min(1, (now - g.gathered - 150) / 900));
            reel = r * r * (3 - 2 * r);
            if (r < 1) animating = true;
          }
          let finaleFrac = 0;
          pieces.forEach((p, i) => {
            let pt = tip;
            knots.forEach((k, j) => { if (k.idx <= i) pt = Math.min(pt, limits[j]); });
            let frac;
            if (p.finale && pt !== Infinity) {
              // The loop doubles back up the page, so y can't drive it: run it
              // over the scroll left between its start reaching the tip and
              // (just short of) the bottom of the page.
              // Done as Kontakt fills the screen (or at the page bottom, if
              // that comes first) so the ball winds up fully in view.
              const endTip = Math.min(
                document.documentElement.scrollHeight - window.innerHeight * 0.25 - 40,
                (threads.tops.kontakt ?? Infinity) + window.innerHeight * 0.75);
              frac = Math.max(0, Math.min(1, (pt - p.ys[0]) / Math.max(1, endTip - p.ys[0])));
              finaleFrac = frac;
            } else frac = fracAt(p, pt);
            frac *= 1 - reel;
            const off = String(frac <= 0 ? 1.01 : 1 - frac);
            p.els.forEach(e => { e.style.strokeDashoffset = off; });
          });
          // Knots pop in as the drawing reaches them
          knots.forEach(k => { if (k.el) k.el.classList.toggle('reached', g.gathered === null && tip >= k.tipY - 20); });
          const n = threads.notes || {};
          if (noteEls.intro1) noteEls.intro1.classList.toggle('shown', playing && g.gathered === null && introState.value > 0.6);
          if (noteEls.intro2 && n.intro2) noteEls.intro2.classList.toggle('shown', playing && g.gathered === null && tip >= n.intro2.y - 40);
          // Scrolled well past a knot still tied? Offer a way back up.
          // …but not once they've reached Kontakt: the ordinary ending is a
          // perfectly good ending, so it shouldn't nag there.
          const kRect = document.getElementById('kontakt')?.getBoundingClientRect();
          const inKontakt = kRect && kRect.top < window.innerHeight * 0.5;
          const stuck = !inKontakt && knots.find(k => g.untied[k.key] === undefined && tip > k.tipY + window.innerHeight * 1.1);
          if (chip) { chip.classList.toggle('shown', !!stuck); chip.dataset.target = stuck ? String(stuck.tipY) : ''; }
          // All knots undone and the loop has arrived: gather the yarn
          const allUntied = knots.every(k => g.untied[k.key] !== undefined);
          const kontakt = document.getElementById('kontakt');
          let arrived = finaleFrac > 0.985;
          if (kontakt) {
            kontakt.classList.toggle('yarn-ready', playing && allUntied && knots.length > 0);
            kontakt.classList.toggle('yarn-gathered', g.gathered !== null);
            // Fallback: Kontakt mostly on screen for a while counts as arrived,
            // so its content can never stay hidden waiting on the loop.
            const r = kontakt.getBoundingClientRect();
            const seen = Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0) > window.innerHeight * 0.7;
            if (seen && allUntied) {
              if (g.seenSince == null) g.seenSince = now;
              if (now - g.seenSince > 2500) arrived = true; else animating = true;
            } else g.seenSince = null;
          }
          if (playing && allUntied && arrived && g.gathered === null) {
            if (!gatherTimer) gatherTimer = setTimeout(() => {
              gatherTimer = null;
              if (g.gathered !== null) return;
              g.gathered = performance.now();
              setGame(s => ({ ...s, gathered: true }));
              kickRef.current();
            }, 0);
          } else if (gatherTimer && !arrived) { clearTimeout(gatherTimer); gatherTimer = null; }
          if (animating) rafId = requestAnimationFrame(apply);
        };
        kickRef.current = () => { if (rafId === null) rafId = requestAnimationFrame(apply); };
        // Starts 0.5s after page load, once the hero's bottom-right blob has faded in
        const tick = now => {
          if (introState.start === null) introState.start = now + 500;
          const t = Math.max(0, Math.min(1, (now - introState.start) / 1400));
          introState.value = 1 - Math.pow(1 - t, 3);
          apply();
          rafId = t < 1 ? requestAnimationFrame(tick) : null;
        };
        const onScroll = () => { if (rafId === null) rafId = requestAnimationFrame(apply); };
        if (!reducedMotion && introState.value < 1) rafId = requestAnimationFrame(tick);
        else apply();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => {
          window.removeEventListener('scroll', onScroll);
          if (rafId !== null) cancelAnimationFrame(rafId);
          clearTimeout(gatherTimer);
          kickRef.current = () => {};
          // Hand the doodle lines back to their CSS draw-in (e.g. on phone widths)
          pieces.forEach(p => p.els.forEach(e => { e.classList.remove('scroll-line'); e.style.strokeDashoffset = ''; }));
        };
      }, [threads, reducedMotion]);

      if (!threads) return null;
      const untie = key => {
        if (gameRef.current.untied[key] !== undefined) return;
        gameRef.current.untied[key] = performance.now();
        setGame(s => ({ ...s, untied: { ...s.untied, [key]: true } }));
        const pointer = document.getElementById('pointer');
        if (pointer) pointer.classList.remove('active');
        kickRef.current();
      };
      const pointerOn = () => { const el = document.getElementById('pointer'); if (el) el.classList.add('active'); };
      const pointerOff = () => { const el = document.getElementById('pointer'); if (el) el.classList.remove('active'); };
      const notes = threads.notes || {};
      const overlay = !reducedMotion && (
        <div key="game" style={{ position: 'absolute', top: 0, left: 0, width: 0, height: 0, zIndex: 50 }}>
          {notes.intro1 && (
            <div className="thread-note" data-thread-note="intro1" style={{ left: notes.intro1.x, top: notes.intro1.y, '--tilt': `${notes.intro1.angle}deg` }}>
              Hjelp meg å samle tråden!
            </div>
          )}
          {notes.intro2 && (
            <div className="thread-note" data-thread-note="intro2" style={{ left: notes.intro2.x, top: notes.intro2.y, '--tilt': `${notes.intro2.angle}deg` }}>
              …knuter kan oppstå
            </div>
          )}
          {(threads.knots || []).map(k => (
            <div key={k.key} className="knot" data-untied={game.untied[k.key] ? '' : undefined} data-knot={k.key} style={{ left: k.x, top: k.y }}>
              <div className="knot-inner" style={{ '--halo': k.bg }}>
                <div className="thread-note knot-ask" style={{ left: 37 + k.label.dx, top: 37 + k.label.dy }}>
                  Knute!
                  <span style={{ display: 'block', fontSize: '0.8em', fontWeight: 500 }}>klikk for å nøste den opp</span>
                </div>
                <button className="knot-btn" aria-label="Løs opp knuten på tråden"
                  onClick={() => untie(k.key)} onMouseEnter={pointerOn} onMouseLeave={pointerOff}>
                  <svg viewBox="0 0 74 74" width="74" height="74" aria-hidden="true" style={{ overflow: 'visible' }}>
                    <g className="knot-scribble">
                      {/* Rotation lives on a wrapper <g>: the loop's own CSS transform
                          (used to spin it away) would otherwise replace it */}
                      {KNOT_LOOPS.map(([rx, ry, rot, spin], i) => (
                        <g key={i} transform={`rotate(${rot} 37 37)`}>
                          <ellipse className="knot-loop" cx={37 + (i % 3 - 1) * 2} cy={37 + (i % 2 ? 2 : -2)} rx={rx * 1.3} ry={ry * 1.3}
                            fill="none" stroke={tweaks.accent} strokeWidth="1.4"
                            style={{ '--spin': `${spin}deg`, transitionDelay: `${i * 0.04}s` }} />
                        </g>
                      ))}
                    </g>
                  </svg>
                </button>
                <div className="thread-note knot-thanks" style={{ left: 37 + k.label.dx, top: 37 + k.label.dy }}>Takk!</div>
              </div>
            </div>
          ))}
          {game.gathered && notes.ball && <YarnBallFinale x={notes.ball.x} y={notes.ball.y} size={notes.ball.size} tweaks={tweaks} />}
        </div>
      );
      const chip = !reducedMotion && (
        <button key="chip" className="thread-chip" data-thread-chip="" aria-label="Gå tilbake til knuten på tråden"
          onMouseEnter={pointerOn} onMouseLeave={pointerOff}
          onClick={e => {
            const y = Number(e.currentTarget.dataset.target);
            if (y) window.scrollTo({ top: y - window.innerHeight * 0.55, behavior: 'smooth' });
          }}>!knute!</button>
      );
      return [overlay, chip, ...threads.list.flatMap(t => t.sections.map(sec => {
        const layer = document.querySelector(`[data-doodle-layer="${sec}"]`);
        if (!layer || threads.tops[sec] === null) return null;
        return ReactDOM.createPortal(
          <svg key={`${t.key}-${sec}`} style={{
            position: 'absolute', top: -threads.tops[sec], left: 0, width: 1, height: 1, overflow: 'visible'
          }}>
            <ThreadStroke className="doodle-line scroll-line" d={t.d} layer={`piece:${t.key}`} tweaks={tweaks}
              main={{ 'data-thread-piece': t.key }} />
          </svg>,
          layer
        );
      }))];
    }

    function App() {
      const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
      const [tweaksOpen, setTweaksOpen] = useState(false);
      const bp = useBreakpoint();
      useReveal();

      useEffect(() => {
        window.addEventListener('message', (e) => {
          if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
          if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
        });
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
      }, []);

      useEffect(() => {
        document.documentElement.style.setProperty('--accent', tweaks.accent);
        document.documentElement.style.setProperty('--bg', tweaks.bg);
      }, [tweaks]);

      return (
        <>
          {/* Twisted-strand texture for the thread (ThreadStroke) */}
          <svg width="0" height="0" style={{ position: 'absolute' }} aria-hidden="true">
            <pattern id="thread-twist" patternUnits="userSpaceOnUse" width="3.6" height="3.6" patternTransform="rotate(58)">
              <rect width="1.3" height="3.6" fill={tweaks.dark} fillOpacity="0.3" />
            </pattern>
          </svg>
          <Cursor />
          <Nav tweaks={tweaks} bp={bp} />
          <Hero tweaks={tweaks} bp={bp} />
          <AboutMe tweaks={tweaks} bp={bp} />
          <Education tweaks={tweaks} bp={bp} />
          <Experience tweaks={tweaks} bp={bp} />
          <Projects tweaks={tweaks} bp={bp} />
          <Skills tweaks={tweaks} bp={bp} />
          <Volunteer tweaks={tweaks} bp={bp} />
          <Contact tweaks={tweaks} bp={bp} />
          <PageThread tweaks={tweaks} bp={bp} />
          <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} open={tweaksOpen} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
