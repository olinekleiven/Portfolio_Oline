<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oline Flatabø Kleiven — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #EDE0CF; color: #2A2620; font-family: 'DM Sans', sans-serif; overflow-x: hidden; }

    /* Scroll reveal */
    .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s cubic-bezier(.16,1,.3,1), transform 0.8s cubic-bezier(.16,1,.3,1); }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-left { opacity: 0; transform: translateX(-40px); transition: opacity 0.9s cubic-bezier(.16,1,.3,1), transform 0.9s cubic-bezier(.16,1,.3,1); }
    .reveal-left.visible { opacity: 1; transform: translateX(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.35s; }
    .reveal-delay-4 { transition-delay: 0.5s; }

    /* Custom cursor */
    * { cursor: none !important; }
    #cursor { position: fixed; width: 12px; height: 12px; background: #C04B22; border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: transform 0.15s ease, width 0.3s ease, height 0.3s ease, background 0.3s ease; mix-blend-mode: multiply; }
    #cursor.hover { width: 48px; height: 48px; background: rgba(192,75,34,0.15); }
    #cursor-ring { position: fixed; width: 40px; height: 40px; border: 1.5px solid rgba(192,75,34,0.4); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); transition: all 0.35s cubic-bezier(.16,1,.3,1); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #EDE0CF; }
    ::-webkit-scrollbar-thumb { background: #C04B22; border-radius: 2px; }

    /* Tweaks panel */
    #tweaks-panel { position: fixed; bottom: 24px; right: 24px; background: #2A2620; color: #EDE0CF; padding: 20px; border-radius: 12px; width: 240px; z-index: 9000; font-family: 'DM Sans', sans-serif; font-size: 13px; display: none; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    #tweaks-panel.open { display: block; }
    #tweaks-panel h4 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.5; margin-bottom: 16px; }
    .tweak-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .tweak-row label { opacity: 0.8; }
    .tweak-row input[type=color] { width: 28px; height: 28px; border: none; border-radius: 50%; cursor: pointer !important; background: none; padding: 0; }
    .tweak-row input[type=range] { width: 100px; accent-color: #C04B22; cursor: pointer !important; }
    .tweak-row select { background: #3A352F; color: #EDE0CF; border: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer !important; }

    /* Marquee */
    .marquee-track { display: flex; animation: marquee 28s linear infinite; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* Touch devices: disable custom cursor */
    @media (hover: none) {
      #cursor, #cursor-ring { display: none !important; }
      * { cursor: auto !important; }
    }
  </style>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg">
      <rect width="80" height="56" fill="#f3e9dd"/>
      <circle cx="40" cy="22" r="10" fill="#C04B22" opacity="0.3"/>
      <rect x="16" y="36" width="48" height="3" rx="1.5" fill="#2A2620" opacity="0.2"/>
      <rect x="24" y="42" width="32" height="2" rx="1" fill="#C04B22" opacity="0.4"/>
    </svg>
  </template>
</head>
<body>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#b95d3c",
      "bg": "#f5ead8",
      "dark": "#2A2620",
      "fontHeading": "Playfair Display",
      "spacing": 1.1
    }/*EDITMODE-END*/;

    // Scroll progress bar
    function ScrollProgress({ tweaks }) {
      const [pct, setPct] = useState(0);
      useEffect(() => {
        const h = () => {
          const el = document.documentElement;
          setPct((window.scrollY / (el.scrollHeight - el.clientHeight)) * 100);
        };
        window.addEventListener('scroll', h);
        return () => window.removeEventListener('scroll', h);
      }, []);
      return (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, height: 3, zIndex: 9999, background: 'transparent' }}>
          <div style={{ height: '100%', width: pct + '%', background: tweaks.accent, transition: 'width 0.1s linear', transformOrigin: 'left' }} />
        </div>
      );
    }

    // Text scramble hook
    const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    function useScramble(text, delay = 400) {
      const [display, setDisplay] = useState(text);
      useEffect(() => {
        let frame = 0, iter = 0;
        const timeout = setTimeout(() => {
          const interval = setInterval(() => {
            setDisplay(text.split('').map((ch, i) => {
              if (ch === ' ') return ' ';
              if (i < iter) return text[i];
              return CHARS[Math.floor(Math.random() * CHARS.length)];
            }).join(''));
            iter += 0.4;
            if (iter >= text.length) clearInterval(interval);
          }, 40);
        }, delay);
        return () => clearTimeout(timeout);
      }, [text]);
      return display;
    }

    // Magnetic button wrapper
    function MagBtn({ children, style, ...props }) {
      const ref = useRef(null);
      const handleMove = (e) => {
        const r = ref.current.getBoundingClientRect();
        const x = (e.clientX - r.left - r.width / 2) * 0.25;
        const y = (e.clientY - r.top - r.height / 2) * 0.25;
        ref.current.style.transform = `translate(${x}px, ${y}px)`;
      };
      const handleLeave = () => { ref.current.style.transform = 'translate(0,0)'; };
      return (
        <span ref={ref} className="mag-btn" onMouseMove={handleMove} onMouseLeave={handleLeave} style={{ display: 'inline-block', ...style }}>
          {React.cloneElement(children, props)}
        </span>
      );
    }

    // Skills marquee ticker
    const tickerItems = ['Figma', '✦', 'React', '✦', 'User Testing', '✦', 'Prototyping', '✦', 'Interaction Design', '✦', 'HTML / CSS / JS', '✦', 'Python', '✦', 'UX Research', '✦', 'Wireframing', '✦', 'mySQL', '✦'];

    function Ticker({ tweaks }) {
      const items = [...tickerItems, ...tickerItems];
      return (
        <div style={{ overflow: 'hidden', background: tweaks.accent, padding: '14px 0', borderTop: `1px solid ${tweaks.accent}`, borderBottom: `1px solid ${tweaks.accent}` }}>
          <div className="marquee-track">
            {items.map((item, i) => (
              <span key={i} style={{ color: '#fff', fontSize: 13, fontWeight: 500, letterSpacing: '0.08em', textTransform: 'uppercase', paddingRight: 32, whiteSpace: 'nowrap', opacity: item === '✦' ? 0.5 : 1 }}>{item}</span>
            ))}
          </div>
        </div>
      );
    }

    // Cursor
    function Cursor() {
      useEffect(() => {
        const cursor = document.getElementById('cursor');
        const ring = document.getElementById('cursor-ring');
        let mx = 0, my = 0;
        const move = (e) => {
          mx = e.clientX; my = e.clientY;
          cursor.style.left = mx + 'px';
          cursor.style.top = my + 'px';
        };
        let frame;
        const smooth = () => {
          const rx = parseFloat(ring.style.left) || mx;
          const ry = parseFloat(ring.style.top) || my;
          ring.style.left = (rx + (mx - rx) * 0.12) + 'px';
          ring.style.top = (ry + (my - ry) * 0.12) + 'px';
          frame = requestAnimationFrame(smooth);
        };
        const over = () => cursor.classList.add('hover');
        const out = () => cursor.classList.remove('hover');
        document.addEventListener('mousemove', move);
        document.querySelectorAll('a,button,[data-hover]').forEach(el => {
          el.addEventListener('mouseenter', over);
          el.addEventListener('mouseleave', out);
        });
        frame = requestAnimationFrame(smooth);
        return () => { document.removeEventListener('mousemove', move); cancelAnimationFrame(frame); };
      }, []);
      return null;
    }

    // Breakpoint hook
    function useBreakpoint() {
      const [width, setWidth] = useState(window.innerWidth);
      useEffect(() => {
        const h = () => setWidth(window.innerWidth);
        window.addEventListener('resize', h);
        return () => window.removeEventListener('resize', h);
      }, []);
      return { isMobile: width < 640, isTablet: width < 1024, width };
    }

    // Scroll reveal hook
    function useReveal() {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal, .reveal-left');
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      });
    }

    // Nav
    function Nav({ tweaks, bp }) {
      const [scrolled, setScrolled] = useState(false);
      const [isDark, setIsDark] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const navItems = ['Om', 'Erfaring', 'Prosjekter', 'Ferdigheter', 'Verv', 'Kontakt'];
      useEffect(() => {
        const darkIds = ['om', 'kontakt'];
        const check = () => {
          setScrolled(window.scrollY > 60);
          let dark = false;
          darkIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
              const rect = el.getBoundingClientRect();
              if (rect.top <= 80 && rect.bottom > 0) dark = true;
            }
          });
          setIsDark(dark);
        };
        window.addEventListener('scroll', check);
        check();
        return () => window.removeEventListener('scroll', check);
      }, []);
      useEffect(() => { if (!bp.isMobile) setMenuOpen(false); }, [bp.isMobile]);
      const textColor = isDark ? tweaks.bg : tweaks.dark;
      const navBg = menuOpen
        ? tweaks.dark
        : scrolled ? (isDark ? tweaks.dark + 'ee' : tweaks.bg + 'ee') : 'transparent';
      return (
        <>
          <nav style={{
            position: 'fixed', top: 0, left: 0, right: 0, zIndex: 101,
            padding: bp.isMobile ? '16px 24px' : '20px 48px',
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            background: navBg,
            backdropFilter: scrolled && !menuOpen ? 'blur(12px)' : 'none',
            transition: 'background 0.4s ease, color 0.4s ease',
            borderBottom: scrolled && !menuOpen ? `1px solid ${textColor}18` : 'none'
          }}>
            <a href="#hero" style={{ fontFamily: tweaks.fontHeading, fontSize: 18, letterSpacing: '-0.02em', color: menuOpen ? tweaks.bg : textColor, textDecoration: 'none', transition: 'color 0.4s ease', zIndex: 102 }}>
              Oline<span style={{ color: tweaks.accent, fontStyle: 'italic' }}>.</span>
            </a>
            {bp.isMobile ? (
              <button onClick={() => setMenuOpen(!menuOpen)} style={{
                background: 'none', border: 'none', padding: 8, cursor: 'pointer',
                display: 'flex', flexDirection: 'column', gap: 5, zIndex: 102
              }}>
                {[0, 1, 2].map(i => (
                  <div key={i} style={{
                    width: 24, height: 2, borderRadius: 1,
                    background: menuOpen ? tweaks.bg : textColor,
                    transition: 'all 0.3s ease',
                    transform: menuOpen && i === 0 ? 'rotate(45deg) translate(5px, 5px)' :
                               menuOpen && i === 1 ? 'scaleX(0)' :
                               menuOpen && i === 2 ? 'rotate(-45deg) translate(5px, -5px)' : 'none',
                    opacity: menuOpen && i === 1 ? 0 : 1
                  }} />
                ))}
              </button>
            ) : (
              <div style={{ display: 'flex', gap: bp.isTablet ? 20 : 36 }}>
                {navItems.map(item => (
                  <a key={item} href={`#${item.toLowerCase()}`} style={{
                    color: textColor, textDecoration: 'none', fontSize: 13,
                    fontWeight: 500, letterSpacing: '0.04em', opacity: 0.7,
                    transition: 'opacity 0.2s, color 0.4s ease', cursor: 'none'
                  }}
                  onMouseEnter={e => e.target.style.opacity = 1}
                  onMouseLeave={e => e.target.style.opacity = 0.7}
                  >{item}</a>
                ))}
              </div>
            )}
          </nav>
          {bp.isMobile && (
            <div style={{
              position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, zIndex: 100,
              background: tweaks.dark,
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
              gap: 4,
              opacity: menuOpen ? 1 : 0,
              pointerEvents: menuOpen ? 'auto' : 'none',
              transition: 'opacity 0.35s ease'
            }}>
              {navItems.map((item) => (
                <a key={item} href={`#${item.toLowerCase()}`}
                  onClick={() => setMenuOpen(false)}
                  style={{
                    color: tweaks.bg, textDecoration: 'none',
                    fontFamily: tweaks.fontHeading, fontSize: 'clamp(36px, 10vw, 52px)',
                    fontWeight: 400, letterSpacing: '-0.02em', opacity: 0.85,
                    transition: 'opacity 0.2s'
                  }}
                  onMouseEnter={e => e.target.style.opacity = 1}
                  onMouseLeave={e => e.target.style.opacity = 0.85}
                >{item}</a>
              ))}
              <div style={{ marginTop: 48, display: 'flex', gap: 24 }}>
                <a href="mailto:olinefk@outlook.com" style={{ color: tweaks.accent, fontSize: 14, textDecoration: 'none' }}>✉ E-post</a>
                <a href="https://www.linkedin.com/in/oline-kleiven-99852b264/" target="_blank" rel="noopener" style={{ color: tweaks.accent, fontSize: 14, textDecoration: 'none' }}>LinkedIn ↗</a>
              </div>
            </div>
          )}
        </>
      );
    }

    // Hero
    function Hero({ tweaks, bp }) {
      const scrambled = useScramble('Interaksjonsdesign', 600);
      const [scrollY, setScrollY] = React.useState(0);
      React.useEffect(() => {
        const h = () => setScrollY(window.scrollY);
        window.addEventListener('scroll', h);
        return () => window.removeEventListener('scroll', h);
      }, []);

      // Portrait: same position as desktop on tablet, just proportionally smaller
      const portraitSize = bp.isMobile ? 200 : bp.isTablet ? Math.round(bp.width * 0.28) : 380;
      const sidePad = bp.isMobile ? '24px' : '48px';

      return (
        <section id="hero" style={{
          minHeight: '100vh', display: 'flex', flexDirection: 'column',
          justifyContent: bp.isMobile ? 'center' : 'flex-end',
          padding: bp.isMobile ? `100px ${sidePad} 60px` : `0 ${sidePad} 80px`,
          background: tweaks.bg, position: 'relative', overflow: 'hidden'
        }}>

          {/* Portrait — inline on mobile, absolute top-right on tablet+desktop */}
          {bp.isMobile ? (
            <div style={{
              width: portraitSize, height: portraitSize, borderRadius: '50%', overflow: 'hidden',
              border: `2px solid ${tweaks.accent}50`,
              boxShadow: `0 0 0 8px ${tweaks.accent}10`,
              marginBottom: 28, flexShrink: 0
            }}>
              <img src="uploads/profilbilde_oline.png" alt="Oline Flatabø Kleiven"
                style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center top' }} />
            </div>
          ) : (
            <div style={{
              position: 'absolute',
              top: '50%',
              right: '6%',
              transform: `translateY(calc(-50% + ${scrollY * 0.12}px))`,
              width: portraitSize, height: portraitSize,
              borderRadius: '50%', overflow: 'hidden',
              border: `3px solid ${tweaks.accent}40`,
              boxShadow: `0 0 0 12px ${tweaks.accent}10`,
              pointerEvents: 'none', transition: 'transform 0.08s linear'
            }}>
              <img src="uploads/profilbilde_oline.png" alt="Oline Flatabø Kleiven"
                style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center top' }} />
            </div>
          )}

          <div style={{ maxWidth: 900 }}>
            <p className="reveal" style={{
              fontSize: 13, letterSpacing: '0.16em', textTransform: 'uppercase',
              color: tweaks.accent, fontWeight: 500, marginBottom: 24
            }}>Oline Flatabø Kleiven</p>

            <h1 className="reveal reveal-delay-1" style={{
              fontFamily: tweaks.fontHeading,
              fontSize: bp.isMobile ? 'clamp(40px, 11vw, 64px)' : 'clamp(52px, 8vw, 110px)',
              lineHeight: 1.0, letterSpacing: '-0.03em', color: tweaks.dark,
              marginBottom: 32, fontWeight: 400
            }}>
              {scrambled}<br/>
              <span style={{ fontStyle: 'italic', color: tweaks.accent }}>&</span> utvikling
            </h1>

            <p className="reveal reveal-delay-2" style={{
              fontSize: bp.isMobile ? 16 : 18, lineHeight: 1.7,
              maxWidth: bp.isMobile ? '100%' : 480,
              color: tweaks.dark, opacity: 0.65, marginBottom: 48,
              fontWeight: 300
            }}>
              Masterstudent ved UiB — bygger grensesnitt der teknologi
              møter menneskelig forståelse.
            </p>

            <div className="reveal reveal-delay-3" style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
              <a href="#prosjekter" data-hover style={{
                background: tweaks.dark, color: tweaks.bg,
                padding: '14px 32px', borderRadius: 100, textDecoration: 'none',
                fontSize: 14, fontWeight: 500, letterSpacing: '0.02em',
                transition: 'background 0.2s ease, transform 0.2s', display: 'inline-block'
              }}
              onMouseEnter={e => { e.target.style.background = tweaks.accent; e.target.style.transform = 'translateY(-2px)'; }}
              onMouseLeave={e => { e.target.style.background = tweaks.dark; e.target.style.transform = 'translateY(0)'; }}
              >Se arbeidet mitt ↓</a>

              <a href="uploads/OlineKleivenCV.pdf" download="OlineKleivenCV.pdf" data-hover style={{
                color: tweaks.dark, padding: '14px 32px', borderRadius: 100,
                textDecoration: 'none', fontSize: 14, fontWeight: 500, letterSpacing: '0.02em',
                border: `1.5px solid ${tweaks.dark}40`, display: 'inline-block',
                transition: 'border-color 0.2s, transform 0.2s'
              }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = tweaks.accent; e.currentTarget.style.transform = 'translateY(-2px)'; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = tweaks.dark+'40'; e.currentTarget.style.transform = 'translateY(0)'; }}
              >↓ Last ned CV</a>
            </div>
          </div>

          {/* Scroll indicator — hidden on mobile */}
          {!bp.isMobile && (
            <div style={{
              position: 'absolute', bottom: 40, right: 48,
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8
            }}>
              <div style={{
                width: 1, height: 60,
                background: `linear-gradient(to bottom, ${tweaks.accent}, transparent)`,
                animation: 'scrollPulse 2s ease-in-out infinite'
              }} />
              <span style={{ fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', opacity: 0.4, writingMode: 'vertical-lr' }}>scroll</span>
            </div>
          )}
        </section>
      );
    }

    // About
    function About({ tweaks, bp }) {
      const sidePad = bp.isMobile ? '24px' : '48px';
      return (
        <section id="om" style={{
          padding: `${72 * tweaks.spacing}px ${sidePad}`,
          background: tweaks.dark, color: tweaks.bg,
          minHeight: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'center'
        }}>
          <div style={{ maxWidth: 1100, margin: '0 auto', width: '100%' }}>

            {/* Top row: photo + label */}
            <div className="reveal" style={{ display: 'flex', alignItems: 'center', gap: 20, marginBottom: 40 }}>
              <div style={{ width: 60, height: 60, borderRadius: '50%', overflow: 'hidden', border: `2px solid ${tweaks.accent}60`, flexShrink: 0 }}>
                <img src="uploads/profilbilde_oline.png" alt="Oline" style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center top' }} />
              </div>
              <p style={{ fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: tweaks.accent, fontWeight: 500 }}>Om meg</p>
            </div>

            {/* Main grid: single column on mobile, two on desktop */}
            <div style={{
              display: 'grid',
              gridTemplateColumns: bp.isMobile ? '1fr' : '1fr 1fr',
              gap: bp.isMobile ? 48 : 80,
              alignItems: 'start'
            }}>
              <div>
                <h2 className="reveal" style={{
                  fontFamily: tweaks.fontHeading,
                  fontSize: bp.isMobile ? 'clamp(28px, 8vw, 38px)' : 'clamp(36px, 4vw, 52px)',
                  lineHeight: 1.15, letterSpacing: '-0.02em', fontWeight: 400, marginBottom: 24
                }}>
                  Teknologi som<br/>
                  <span style={{ fontStyle: 'italic', color: tweaks.accent }}>forstår mennesker</span>
                </h2>
                <p className="reveal reveal-delay-1" style={{
                  fontSize: bp.isMobile ? 14 : 16,
                  lineHeight: 1.8, opacity: 0.65, fontWeight: 300
                }}>
                  Bachelorgrad i informasjonsvitenskap, masterstudent i interaksjonsdesign ved UiB.
                  Eg spesialiserer meg på brukarvennlege løysingar og frontend-utvikling — med
                  ein blid, engasjert og nysgjerrig tilnærming til alt eg lagar.
                </p>
              </div>

              {/* Education */}
              <div className="reveal reveal-delay-1">
                <p style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', color: tweaks.accent, fontWeight: 600, marginBottom: 20 }}>Utdanning</p>
                {[
                  { school: 'Universitetet i Bergen', degree: 'Master — Medie og Interaksjonsdesign', period: '2025 –' },
                  { school: 'Universitetet i Bergen', degree: 'Bachelor — Informasjonsvitenskap', period: '2022 – 2025' },
                  { school: 'Møre Folkehøgskule', degree: 'Ekstremsport', period: '2021 – 2022' },
                ].map((e, i) => {
                  const [hov, setHov] = React.useState(false);
                  return (
                  <div key={i} data-hover
                    onMouseEnter={() => setHov(true)}
                    onMouseLeave={() => setHov(false)}

          }}
        >
          <p style={{ fontSize: Math.max(9, Math.round(10 * scale)), letterSpacing: '0.12em', textTransform: 'uppercase', fontWeight: 700,
            color: hov ? 'rgba(255,255,255,0.7)' : b.color, marginBottom: 6, transition: 'color 0.4s' }}>{b.org}</p>
          <p style={{ fontFamily: tweaks.fontHeading, fontSize: Math.max(13, Math.round((sz > 200 ? 18 : 16) * scale)), fontWeight: 400,
            color: hov ? '#fff' : tweaks.dark, lineHeight: 1.2, marginBottom: 4, transition: 'color 0.4s' }}>{b.role}</p>
          <p style={{ fontSize: Math.max(10, Math.round(11 * scale)), color: hov ? 'rgba(255,255,255,0.65)' : tweaks.dark,
            opacity: hov ? 1 : 0.4, transition: 'all 0.4s' }}>{b.period}</p>
          {hov && <p style={{ fontSize: Math.max(10, Math.round(11 * scale)), color: 'rgba(255,255,255,0.6)', marginTop: 6, lineHeight: 1.4 }}>{b.sub}</p>}
        </div>
      );
    }

    function VolunteerBubbles({ tweaks, bp }) {
      const w = bp ? bp.width : 1100;
      const scale = w <= 400 ? 1 : Math.min(2, 1 + (w - 400) / 900);
      const containerH = Math.round(340 * scale);
      return (
        <div className="reveal" style={{ position: 'relative', height: containerH, width: '100%' }}>
          {bubbleData.map((b, i) => <BubbleItem key={i} b={b} tweaks={tweaks} scale={scale} />)}
        </div>
      );
    }

    // Contact
    function Contact({ tweaks, bp }) {
      const mobile = bp && bp.isMobile;
      const btnBase = {
        borderRadius: 100, textDecoration: 'none', fontSize: 15, fontWeight: 500,
        transition: 'transform 0.2s, opacity 0.2s, border-color 0.2s',
        display: 'block', textAlign: 'center',
        padding: mobile ? '14px 24px' : '16px 40px',
        width: mobile ? '100%' : 'auto',
      };
      return (
        <section id="kontakt" style={{ padding: mobile ? '72px 24px' : `${80 * tweaks.spacing}px 48px`, background: tweaks.dark, color: tweaks.bg, minHeight: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
          <div style={{ maxWidth: 800, margin: '0 auto', width: '100%', textAlign: 'center' }}>
            <p className="reveal" style={{ fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: tweaks.accent, marginBottom: 20, fontWeight: 500 }}>La oss snakke</p>
            <h2 className="reveal reveal-delay-1" style={{
              fontFamily: tweaks.fontHeading, fontSize: mobile ? 'clamp(36px, 11vw, 56px)' : 'clamp(48px, 7vw, 96px)',
              lineHeight: 1.05, letterSpacing: '-0.03em', fontWeight: 400, marginBottom: mobile ? 20 : 32
            }}>
              Trenger du min<br/>
              <span style={{ fontStyle: 'italic', color: tweaks.accent }}>kompetanse?</span>
            </h2>
            <p className="reveal reveal-delay-2" style={{ fontSize: mobile ? 15 : 18, opacity: 0.6, lineHeight: 1.7, marginBottom: mobile ? 40 : 64, fontWeight: 300 }}>
              Eg er alltid åpen for samarbeid, jobbtilbod, praksisplassar og internship innanfor utvikling og design.
            </p>

            <div className="reveal reveal-delay-3" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: mobile ? 12 : 16, marginBottom: mobile ? 40 : 80 }}>
              <a href="mailto:olinefk@outlook.com" data-hover style={{
                background: tweaks.accent, color: '#fff', padding: mobile ? '15px 48px' : '16px 56px',
                borderRadius: 100, textDecoration: 'none', fontSize: 15, fontWeight: 500,
                transition: 'transform 0.2s, opacity 0.2s', display: 'inline-block', width: mobile ? '60%' : 'auto', textAlign: 'center'
              }}
                onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.opacity = '0.9'; }}
                onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.opacity = '1'; }}
              >✉ Send e-post</a>

              <a href="uploads/OlineKleivenCV.pdf" download="OlineKleivenCV.pdf" data-hover style={{
                background: 'transparent', color: tweaks.bg, padding: mobile ? '13px 48px' : '14px 56px',
                borderRadius: 100, textDecoration: 'none', fontSize: 14, fontWeight: 400,
                border: `1.5px solid ${tweaks.bg}30`, transition: 'transform 0.2s, border-color 0.2s',
                display: 'inline-block', width: mobile ? '60%' : 'auto', textAlign: 'center'
              }}
                onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.borderColor = tweaks.accent; }}
                onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.borderColor = tweaks.bg+'30'; }}
              >↓ Last ned CV</a>

              <div style={{ display: 'flex', gap: 32, marginTop: mobile ? 8 : 12 }}>
                <a href="https://www.linkedin.com/in/oline-kleiven-99852b264/" target="_blank" rel="noopener" data-hover style={{
                  color: tweaks.bg, textDecoration: 'none', fontSize: 14, fontWeight: 400,
                  opacity: 0.5, transition: 'opacity 0.2s, transform 0.2s', letterSpacing: '0.02em'
                }}
                  onMouseEnter={e => { e.currentTarget.style.opacity = '1'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
                  onMouseLeave={e => { e.currentTarget.style.opacity = '0.5'; e.currentTarget.style.transform = 'translateY(0)'; }}
                >LinkedIn ↗</a>
                <a href="https://github.com/olinekleiven" target="_blank" rel="noopener" data-hover style={{
                  color: tweaks.bg, textDecoration: 'none', fontSize: 14, fontWeight: 400,
                  opacity: 0.5, transition: 'opacity 0.2s, transform 0.2s', letterSpacing: '0.02em'
                }}
                  onMouseEnter={e => { e.currentTarget.style.opacity = '1'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
                  onMouseLeave={e => { e.currentTarget.style.opacity = '0.5'; e.currentTarget.style.transform = 'translateY(0)'; }}
                >GitHub ↗</a>
              </div>
            </div>

            <div style={{ borderTop: `1px solid ${tweaks.bg}15`, paddingTop: 32, display: 'flex', flexDirection: mobile ? 'column' : 'row', justifyContent: 'space-between', alignItems: 'center', gap: mobile ? 6 : 0, fontSize: 13, opacity: 0.4 }}>
              <span>Oline Flatabø Kleiven</span>
              <span>olinefk@outlook.com</span>
              <span>Bergen, Norge</span>
            </div>
          </div>
        </section>
      );
    }

    // Tweaks Panel
    function TweaksPanel({ tweaks, setTweaks, open }) {
      const update = (key, val) => {
        const next = { ...tweaks, [key]: val };
        setTweaks(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
      };
      return (
        <div id="tweaks-panel" className={open ? 'open' : ''}>
          <h4>Tweaks</h4>
          <div className="tweak-row"><label>Accentfarge</label><input type="color" value={tweaks.accent} onChange={e => update('accent', e.target.value)} /></div>
          <div className="tweak-row"><label>Bakgrunn</label><input type="color" value={tweaks.bg} onChange={e => update('bg', e.target.value)} /></div>
          <div className="tweak-row"><label>Skrift</label>
            <select value={tweaks.fontHeading} onChange={e => update('fontHeading', e.target.value)}>
              <option>DM Serif Display</option>
              <option>Playfair Display</option>
              <option>Georgia</option>
            </select>
          </div>
          <div className="tweak-row"><label>Romlighet</label><input type="range" min="0.7" max="1.4" step="0.1" value={tweaks.spacing} onChange={e => update('spacing', parseFloat(e.target.value))} /></div>
        </div>
      );
    }

    function App() {
      const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
      const [tweaksOpen, setTweaksOpen] = useState(false);
      const bp = useBreakpoint();
      useReveal();

      useEffect(() => {
        window.addEventListener('message', (e) => {
          if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
          if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
        });
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
      }, []);

      useEffect(() => {
        document.documentElement.style.setProperty('--accent', tweaks.accent);
        document.documentElement.style.setProperty('--bg', tweaks.bg);
      }, [tweaks]);

      return (
        <>
          <ScrollProgress tweaks={tweaks} />
          <Cursor />
          <Nav tweaks={tweaks} bp={bp} />
          <Hero tweaks={tweaks} bp={bp} />
          <About tweaks={tweaks} bp={bp} />
          <Experience tweaks={tweaks} bp={bp} />
          <Projects tweaks={tweaks} bp={bp} />
          <Skills tweaks={tweaks} bp={bp} />
          <Volunteer tweaks={tweaks} bp={bp} />
          <Contact tweaks={tweaks} bp={bp} />
          <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} open={tweaksOpen} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <style>
    @keyframes scrollPulse {
      0%, 100% { opacity: 0.4; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.2); }
    }
  </style>
</body>
</html>
