<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oline Flatabø Kleiven — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #EDE0CF; color: #2A2620; font-family: 'DM Sans', sans-serif; overflow-x: hidden; }

    /* Custom pointer: a plain, neutral white dot that follows the mouse (see
       Cursor() in the script below). Native cursor is hidden everywhere;
       positioning is done with an un-transitioned transform so it tracks the
       mouse with zero lag — only the dot's own size/scale transitions. */
    * { cursor: none !important; }
    #pointer { position: fixed; top: 0; left: 0; width: 0; height: 0; pointer-events: none; z-index: 9999; }
    #pointer-dot {
      position: absolute; left: 0; top: 0;
      width: 16px; height: 16px; margin: -8px 0 0 -8px;
      border-radius: 50%; background: #fff;
      box-shadow: 0 2px 8px rgba(36,31,25,0.35);
      transition: width 0.25s cubic-bezier(.16,1,.3,1), height 0.25s cubic-bezier(.16,1,.3,1),
                  margin 0.25s cubic-bezier(.16,1,.3,1), background 0.25s ease,
                  box-shadow 0.25s ease, transform 0.15s ease;
    }
    #pointer.active #pointer-dot {
      width: 38px; height: 38px; margin: -19px 0 0 -19px;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 6px 18px rgba(36,31,25,0.3);
    }
    #pointer.click #pointer-dot { transform: scale(0.75); }
    @media (hover: none) {
      #pointer { display: none !important; }
      * { cursor: auto !important; }
    }

    /* Scroll reveal */
    .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s cubic-bezier(.16,1,.3,1), transform 0.8s cubic-bezier(.16,1,.3,1); }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-left { opacity: 0; transform: translateX(-40px); transition: opacity 0.9s cubic-bezier(.16,1,.3,1), transform 0.9s cubic-bezier(.16,1,.3,1); }
    .reveal-left.visible { opacity: 1; transform: translateX(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.35s; }
    .reveal-delay-4 { transition-delay: 0.5s; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #EDE0CF; }
    ::-webkit-scrollbar-thumb { background: #C04B22; border-radius: 2px; }

    /* Tweaks panel */
    #tweaks-panel { position: fixed; bottom: 24px; right: 24px; background: #2A2620; color: #EDE0CF; padding: 20px; border-radius: 12px; width: 240px; z-index: 9000; font-family: 'DM Sans', sans-serif; font-size: 13px; display: none; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    #tweaks-panel.open { display: block; }
    #tweaks-panel h4 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.5; margin-bottom: 16px; }
    .tweak-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .tweak-row label { opacity: 0.8; }
    .tweak-row input[type=color] { width: 28px; height: 28px; border: none; border-radius: 50%; cursor: pointer !important; background: none; padding: 0; }
    .tweak-row input[type=range] { width: 100px; accent-color: #C04B22; cursor: pointer !important; }
    .tweak-row select { background: #3A352F; color: #EDE0CF; border: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer !important; }

    /* Marquee */
    .marquee-track { display: flex; animation: marquee 28s linear infinite; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* Paper plane send animation. The trail (paperTrailReveal / paperTrailFade)
       reuses these exact same keyframe checkpoints so the two curves are
       mathematically identical in shape — the trail is given a small
       animation-delay in JS instead of different keyframe stops, so it always
       trails the plane by a fixed, precise amount rather than drifting. */
    @keyframes paperPlaneFly {
      0% { opacity: 0; offset-distance: 0%; }
      6% { opacity: 1; }
      70% { opacity: 1; offset-distance: 100%; }
      100% { opacity: 0; offset-distance: 100%; }
    }
    @keyframes paperTrailReveal {
      0% { stroke-dashoffset: 100; }
      70% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes paperTrailFade {
      0% { opacity: 0; }
      6% { opacity: 0.55; }
      70% { opacity: 0.55; }
      100% { opacity: 0; }
    }

    /* Toolbox — idle wobble on the closed box, to hint it's interactive */
    @keyframes toolboxWobble {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      20% { transform: rotate(-1.4deg) translateY(-2px); }
      50% { transform: rotate(1deg) translateY(0); }
      75% { transform: rotate(-0.6deg) translateY(-1px); }
    }
    .toolbox-wobble { animation: toolboxWobble 4.5s ease-in-out infinite; }
    .toolbox-wobble:hover, .toolbox-wobble:focus-visible { animation-play-state: paused; }
    .toolbox-tool:focus-visible, .toolbox-box:focus-visible, .toolbox-close:focus-visible {
      outline: 3px solid #fff; outline-offset: 3px;
    }
    @media (prefers-reduced-motion: reduce) {
      .toolbox-wobble { animation: none; }
      .toolbox-box, .toolbox-tool, .toolbox-lid, .toolbox-panel { transition-duration: 0.01ms !important; }
    }
  </style>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg">
      <rect width="80" height="56" fill="#f3e9dd"/>
      <circle cx="40" cy="22" r="10" fill="#C04B22" opacity="0.3"/>
      <rect x="16" y="36" width="48" height="3" rx="1.5" fill="#2A2620" opacity="0.2"/>
      <rect x="24" y="42" width="32" height="2" rx="1" fill="#C04B22" opacity="0.4"/>
    </svg>
  </template>
</head>
<body>
  <div id="pointer" aria-hidden="true">
    <div id="pointer-dot"></div>
  </div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#b95d3c",
      "bg": "#f5ead8",
      "dark": "#2A2620",
      "fontHeading": "Playfair Display",
      "spacing": 1.1
    }/*EDITMODE-END*/;


    // Text scramble hook
    const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    function useScramble(text, delay = 400) {
      const [display, setDisplay] = useState(text);
      useEffect(() => {
        let frame = 0, iter = 0;
        const timeout = setTimeout(() => {
          const interval = setInterval(() => {
            setDisplay(text.split('').map((ch, i) => {
              if (ch === ' ') return ' ';
              if (i < iter) return text[i];
              return CHARS[Math.floor(Math.random() * CHARS.length)];
            }).join(''));
            iter += 0.4;
            if (iter >= text.length) clearInterval(interval);
          }, 40);
        }, delay);
        return () => clearTimeout(timeout);
      }, [text]);
      return display;
    }

    // Magnetic button wrapper
    function MagBtn({ children, style, ...props }) {
      const ref = useRef(null);
      const handleMove = (e) => {
        const r = ref.current.getBoundingClientRect();
        const x = (e.clientX - r.left - r.width / 2) * 0.25;
        const y = (e.clientY - r.top - r.height / 2) * 0.25;
        ref.current.style.transform = `translate(${x}px, ${y}px)`;
      };
      const handleLeave = () => { ref.current.style.transform = 'translate(0,0)'; };
      return (
        <span ref={ref} className="mag-btn" onMouseMove={handleMove} onMouseLeave={handleLeave} style={{ display: 'inline-block', ...style }}>
          {React.cloneElement(children, props)}
        </span>
      );
    }

    // Skills marquee ticker
    const tickerItems = ['Figma', '✦', 'React', '✦', 'Brukertesting', '✦', 'Prototyping', '✦', 'Interaction Design', '✦', 'HTML / CSS / JS', '✦', 'Python', '✦', 'UX Research', '✦', 'Wireframing', '✦', 'mySQL', '✦'];

    function Ticker({ tweaks }) {
      const items = [...tickerItems, ...tickerItems];
      return (
        <div style={{ overflow: 'hidden', background: tweaks.accent, padding: '14px 0', borderTop: `1px solid ${tweaks.accent}`, borderBottom: `1px solid ${tweaks.accent}` }}>
          <div className="marquee-track">
            {items.map((item, i) => (
              <span key={i} style={{ color: '#fff', fontSize: 13, fontWeight: 500, letterSpacing: '0.08em', textTransform: 'uppercase', paddingRight: 32, whiteSpace: 'nowrap', opacity: item === '✦' ? 0.5 : 1 }}>{item}</span>
            ))}
          </div>
        </div>
      );
    }

    // Custom pointer: moves the #pointer element 1:1 with the mouse (no
    // lerp/transition on position — that's what caused the old cursor to
    // visibly lag), and toggles the spark/click states via CSS classes.
    function Cursor() {
      useEffect(() => {
        const pointer = document.getElementById('pointer');
        const move = (e) => {
          pointer.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
        };
        const over = () => pointer.classList.add('active');
        const out = () => pointer.classList.remove('active');
        let clickTimer;
        const down = () => {
          pointer.classList.add('click');
          clearTimeout(clickTimer);
          clickTimer = setTimeout(() => pointer.classList.remove('click'), 150);
        };
        document.addEventListener('mousemove', move);
        document.addEventListener('mousedown', down);
        document.querySelectorAll('a, button, [role="link"]').forEach(el => {
          el.addEventListener('mouseenter', over);
          el.addEventListener('mouseleave', out);
        });
        return () => {
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mousedown', down);
          clearTimeout(clickTimer);
        };
      }, []);
      return null;
    }

    // Breakpoint hook
    function useBreakpoint() {
      const [width, setWidth] = useState(window.innerWidth);
      useEffect(() => {
        const h = () => setWidth(window.innerWidth);
        window.addEventListener('resize', h);
        return () => window.removeEventListener('resize', h);
      }, []);
      return { isMobile: width < 640, isTablet: width < 1024, width };
    }

    // Scroll reveal hook
    function useReveal() {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal, .reveal-left');
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      });
    }

    // Nav
    const NAV_SECTIONS = ['hero', 'om', 'prosjekter', 'erfaring', 'skills', 'verv', 'kontakt'];
    const NAV_DARK_SECTIONS = new Set(['om', 'prosjekter', 'kontakt']);
    function Nav({ tweaks, bp }) {
      const [scrolled, setScrolled] = useState(false);
      const [activeSection, setActiveSection] = useState('hero');
      const [menuOpen, setMenuOpen] = useState(false);
      const navItems = [
        { id: 'om', label: 'Om' },
        { id: 'erfaring', label: 'Erfaring' },
        { id: 'prosjekter', label: 'Prosjekter' },
        { id: 'skills', label: 'Skills' },
        { id: 'verv', label: 'Verv' },
        { id: 'kontakt', label: 'Kontakt' },
      ];
      useEffect(() => {
        const check = () => {
          setScrolled(window.scrollY > 60);
          let current = 'hero';
          NAV_SECTIONS.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
              const rect = el.getBoundingClientRect();
              if (rect.top <= 80 && rect.bottom > 0) current = id;
            }
          });
          setActiveSection(current);
        };
        window.addEventListener('scroll', check);
        check();
        return () => window.removeEventListener('scroll', check);
      }, []);
      useEffect(() => { if (!bp.isMobile) setMenuOpen(false); }, [bp.isMobile]);
      const isDark = NAV_DARK_SECTIONS.has(activeSection);
      const sectionBg = {
        hero: tweaks.bg, om: tweaks.dark, prosjekter: '#5B7C8A',
        erfaring: tweaks.bg, skills: tweaks.bg, verv: tweaks.bg, kontakt: tweaks.dark
      };
      const textColor = isDark ? tweaks.bg : tweaks.dark;
      const navBg = menuOpen
        ? tweaks.dark
        : scrolled ? (sectionBg[activeSection] || tweaks.bg) + 'ee' : 'transparent';
      return (
        <>
          <nav style={{
            position: 'fixed', top: 0, left: 0, right: 0, zIndex: 101,
            padding: bp.isMobile ? '16px 24px' : '20px 48px',
            display: bp.isMobile ? 'flex' : 'grid',
            gridTemplateColumns: bp.isMobile ? undefined : '1fr auto 1fr',
            justifyContent: bp.isMobile ? 'space-between' : undefined,
            alignItems: 'center',
            background: navBg,
            backdropFilter: scrolled && !menuOpen ? 'blur(12px)' : 'none',
            transition: 'background 0.4s ease, color 0.4s ease',
            borderBottom: scrolled && !menuOpen ? `1px solid ${textColor}18` : 'none'
          }}>
            <a href="#hero" style={{ fontFamily: tweaks.fontHeading, fontSize: 18, letterSpacing: '-0.02em', color: menuOpen ? tweaks.bg : textColor, textDecoration: 'none', transition: 'color 0.4s ease', zIndex: 102 }}>
              Oline<span style={{ color: tweaks.accent, fontStyle: 'italic' }}>.</span>
            </a>
            {bp.isMobile ? (
              <button onClick={() => setMenuOpen(!menuOpen)}
                aria-label={menuOpen ? 'Lukk meny' : 'Åpne meny'}
                aria-expanded={menuOpen}
                style={{
                background: 'none', border: 'none',
                display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center',
                gap: 5, zIndex: 102, width: 44, height: 44, marginRight: -10
              }}>
                {[0, 1, 2].map(i => (
                  <div key={i} style={{
                    width: 24, height: 2, borderRadius: 1,
                    background: menuOpen ? tweaks.bg : textColor,
                    transition: 'all 0.3s ease',
                    transform: menuOpen && i === 0 ? 'rotate(45deg) translate(5px, 5px)' :
                               menuOpen && i === 1 ? 'scaleX(0)' :
                               menuOpen && i === 2 ? 'rotate(-45deg) translate(5px, -5px)' : 'none',
                    opacity: menuOpen && i === 1 ? 0 : 1
                  }} />
                ))}
              </button>
            ) : (
              <div style={{ display: 'flex', gap: bp.isTablet ? 6 : 10 }}>
                {navItems.map((item, i) => (
                  <a key={item.id} href={`#${item.id}`} style={{
                    color: textColor, textDecoration: 'none', fontSize: 13,
                    fontWeight: 500, letterSpacing: '0.04em',
                    padding: bp.isTablet ? '7px 12px' : '8px 18px',
                    borderRadius: 100,
                    background: `${textColor}12`,
                    border: `1.5px solid ${textColor}30`,
                    transition: 'all 0.25s cubic-bezier(.16,1,.3,1)'
                  }}
                  onMouseEnter={e => {
                    e.target.style.background = tweaks.accent;
                    e.target.style.borderColor = tweaks.accent;
                    e.target.style.color = '#fff';
                    e.target.style.transform = 'translateY(-2px)';
                    e.target.style.boxShadow = `0 8px 18px ${tweaks.accent}55`;
                  }}
                  onMouseLeave={e => {
                    e.target.style.background = `${textColor}12`;
                    e.target.style.borderColor = `${textColor}30`;
                    e.target.style.color = textColor;
                    e.target.style.transform = 'translateY(0)';
                    e.target.style.boxShadow = 'none';
                  }}
                  >{item.label}</a>
                ))}
              </div>
            )}
            {!bp.isMobile && (
              <a href="#hero" aria-label="Til toppen" style={{
                  justifySelf: 'end', display: 'flex', alignItems: 'center', justifyContent: 'center',
                  width: 32, height: 32, color: textColor, textDecoration: 'none', fontSize: 16,
                  opacity: 0.6, transition: 'opacity 0.25s ease, transform 0.25s ease',
                  zIndex: 102
                }}
                onMouseEnter={e => { e.currentTarget.style.opacity = 1; e.currentTarget.style.transform = 'translateY(-2px)'; }}
                onMouseLeave={e => { e.currentTarget.style.opacity = 0.6; e.currentTarget.style.transform = 'translateY(0)'; }}
              >↑</a>
            )}
          </nav>
          {bp.isMobile && (
            <div style={{
              position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, zIndex: 100,
              background: tweaks.dark,
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
              gap: 4,
              opacity: menuOpen ? 1 : 0,
              pointerEvents: menuOpen ? 'auto' : 'none',
              transition: 'opacity 0.35s ease'
            }}>
              {navItems.map((item) => (
                <a key={item.id} href={`#${item.id}`}
                  onClick={() => setMenuOpen(false)}
                  style={{
                    color: tweaks.bg, textDecoration: 'none',
                    fontFamily: tweaks.fontHeading, fontSize: 'clamp(36px, 10vw, 52px)',
                    fontWeight: 400, letterSpacing: '-0.02em', opacity: 0.85,
                    transition: 'opacity 0.2s'
                  }}
                  onMouseEnter={e => e.target.style.opacity = 1}
                  onMouseLeave={e => e.target.style.opacity = 0.85}
                >{item.label}</a>
              ))}
              <div style={{ marginTop: 48, display: 'flex', gap: 24 }}>
                <a href="mailto:olinefk@outlook.com" style={{ color: tweaks.accent, fontSize: 14, textDecoration: 'none' }}>✉ E-post</a>
                <a href="https://www.linkedin.com/in/oline-kleiven-99852b264/" target="_blank" rel="noopener" style={{ color: tweaks.accent, fontSize: 14, textDecoration: 'none' }}>LinkedIn ↗</a>
              </div>
            </div>
          )}
        </>
      );
    }

    // Hero
    function Hero({ tweaks, bp }) {
      const scrambled = useScramble('Digital designer', 600);
      const [scrollY, setScrollY] = React.useState(0);
      React.useEffect(() => {
        const h = () => setScrollY(window.scrollY);
        window.addEventListener('scroll', h);
        return () => window.removeEventListener('scroll', h);
      }, []);

      // Portrait: same position as desktop on tablet, just proportionally smaller
      const portraitSize = bp.isMobile ? 200 : bp.isTablet ? Math.round(bp.width * 0.28) : 380;
      const sidePad = bp.isMobile ? '24px' : '48px';

      return (
        <section id="hero" style={{
          minHeight: '100vh', display: 'flex', flexDirection: 'column',
          justifyContent: bp.isMobile ? 'center' : 'flex-end',
          padding: bp.isMobile ? `100px ${sidePad} 60px` : `0 ${sidePad} 80px`,
          background: tweaks.bg, position: 'relative', overflow: 'hidden'
        }}>

          {/* Portrait — inline on mobile, absolute top-right on tablet+desktop */}
          {bp.isMobile ? (
            <div style={{
              width: portraitSize, height: portraitSize, borderRadius: '50%', overflow: 'hidden',
              border: `2px solid ${tweaks.accent}50`,
              boxShadow: `0 0 0 8px ${tweaks.accent}10`,
              marginBottom: 28, flexShrink: 0
            }}>
              <img src="uploads/profilbilde_oline.png" alt="Oline Flatabø Kleiven"
                style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center top', transform: 'scale(1.22)' }} />
            </div>
          ) : (
            <div style={{
              position: 'absolute',
              top: '50%',
              right: '6%',
              transform: `translateY(calc(-50% + ${scrollY * 0.12}px))`,
              width: portraitSize, height: portraitSize,
              borderRadius: '50%', overflow: 'hidden',
              border: `3px solid ${tweaks.accent}40`,
              boxShadow: `0 0 0 12px ${tweaks.accent}10`,
              pointerEvents: 'none', transition: 'transform 0.08s linear'
            }}>
              <img src="uploads/profilbilde_oline.png" alt="Oline Flatabø Kleiven"
                style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center top', transform: 'scale(1.22)' }} />
            </div>
          )}

          <div style={{ maxWidth: 900 }}>
            <p className="reveal" style={{
              fontSize: 16, letterSpacing: '0.16em', textTransform: 'uppercase',
              color: tweaks.accent, fontWeight: 500, marginBottom: 24
            }}>Oline Flatabø Kleiven</p>

            <h1 className="reveal reveal-delay-1" style={{
              fontFamily: tweaks.fontHeading,
              fontSize: bp.isMobile ? 'clamp(38px, 10vw, 60px)' : 'clamp(52px, 7.5vw, 108px)',
              lineHeight: 1.0, letterSpacing: '-0.03em', color: tweaks.dark,
              marginBottom: 32, fontWeight: 400, whiteSpace: bp.isMobile ? 'normal' : 'nowrap'
            }}>
              {scrambled}
            </h1>

            <p className="reveal reveal-delay-1" style={{
              fontFamily: tweaks.fontHeading,
              fontSize: bp.isMobile ? 'clamp(20px, 4.5vw, 26px)' : 'clamp(23px, 2.6vw, 32px)',
              color: tweaks.accent, fontStyle: 'italic', marginTop: -24,
              marginBottom: 32, fontWeight: 400
            }}>
              med teknisk kompetanse
            </p>

            <p className="reveal reveal-delay-2" style={{
              fontSize: bp.isMobile ? 16 : 18, lineHeight: 1.7,
              maxWidth: bp.isMobile ? '100%' : 480,
              color: tweaks.dark, opacity: 0.65, marginBottom: 48,
              fontWeight: 300
            }}>
              Brobygger mellom design og utvikling
            </p>

            <div className="reveal reveal-delay-3" style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
              <a href="#prosjekter" style={{
                background: tweaks.accent, color: tweaks.bg,
                padding: '14px 32px', borderRadius: 100, textDecoration: 'none',
                fontSize: 14, fontWeight: 500, letterSpacing: '0.02em',
                transition: 'transform 0.2s', display: 'inline-block'
              }}
              onMouseEnter={e => { e.target.style.transform = 'translateY(-2px)'; }}
              onMouseLeave={e => { e.target.style.transform = 'translateY(0)'; }}
              >Prosjekter ↓</a>

              <a href="uploads/Oline_Kleiven_CV.pdf" download="Oline_Kleiven_CV.pdf" style={{
                color: tweaks.dark, background: 'transparent',
                padding: '14px 32px', borderRadius: 100,

    function usePrefersReducedMotion() {
      const [reduced, setReduced] = useState(false);
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        setReduced(mq.matches);
        const handler = (e) => setReduced(e.matches);
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, []);
      return reduced;
    }

    function BubbleItem({ b, tweaks, scale, mouseRef }) {
      const [hov, setHov] = useState(false);
      const [pos, setPos] = useState({ x: 0, y: 0 });
      const hovRef = useRef(false);
      const elRef = useRef(null);
      useEffect(() => { hovRef.current = hov; }, [hov]);

      useEffect(() => {
        let frame;
        let t = Math.random() * Math.PI * 2;
        const amp = 10 + Math.random() * 8;
        const speed = 0.012 + Math.random() * 0.007;
        const animate = () => {
          t += speed;
          let ix = Math.sin(t) * amp;
          let iy = Math.cos(t * 0.7) * amp;

          // Drift away from the cursor when it gets close — skip while the
          // bubble itself is hovered, so the details stay put to read.
          if (!hovRef.current && elRef.current && mouseRef && mouseRef.current) {
            const rect = elRef.current.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = cx - mouseRef.current.x;
            const dy = cy - mouseRef.current.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const influence = rect.width / 2 + 110;
            if (dist < influence && dist > 0.01) {
              const strength = (1 - dist / influence) * 55;
              ix += (dx / dist) * strength;
              iy += (dy / dist) * strength;
            }
          }

          setPos({ x: ix, y: iy });
          frame = requestAnimationFrame(animate);
        };
        frame = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(frame);
      }, []);

      const sz = Math.round(b.size * scale);
      return (
        <div
          ref={elRef}
          style={{
            position: 'absolute',
            left: `${b.x}%`,
            top: `${b.y}%`,
            width: sz,
            height: sz,
            transform: `translate(${pos.x}px, ${pos.y}px)`,
            zIndex: hov ? 2 : 1,
          }}
        >
          <div
            onMouseEnter={() => setHov(true)}
            onMouseLeave={() => setHov(false)}
            style={{
              width: '100%', height: '100%', borderRadius: '50%',
              background: hov ? b.color : `${b.color}18`,
              border: `2px solid ${b.color}${hov ? 'ff' : '60'}`,
              display: 'flex', flexDirection: 'column',
              alignItems: 'center', justifyContent: 'center',
              padding: Math.round(24 * scale), textAlign: 'center',
              transform: hov ? 'scale(1.08)' : 'scale(1)',
              transition: 'background 0.4s, border-color 0.4s, transform 0.4s cubic-bezier(.16,1,.3,1)',
            }}
          >
            <p style={{ fontSize: Math.max(9, Math.round(10 * scale)), letterSpacing: '0.12em', textTransform: 'uppercase', fontWeight: 700,
              color: hov ? 'rgba(255,255,255,0.7)' : b.color, marginBottom: 6, transition: 'color 0.4s' }}>{b.org}</p>
            <p style={{ fontFamily: tweaks.fontHeading, fontSize: Math.max(13, Math.round((sz > 200 ? 18 : 16) * scale)), fontWeight: 400,
              color: hov ? '#fff' : tweaks.dark, lineHeight: 1.2, marginBottom: 4, transition: 'color 0.4s' }}>{b.role}</p>
            <p style={{ fontSize: Math.max(10, Math.round(11 * scale)), color: hov ? 'rgba(255,255,255,0.65)' : tweaks.dark,
              opacity: hov ? 1 : 0.4, transition: 'all 0.4s' }}>{b.period}</p>
            {hov && <p style={{ fontSize: Math.max(10, Math.round(11 * scale)), color: 'rgba(255,255,255,0.6)', marginTop: 6, lineHeight: 1.4 }}>{b.sub}</p>}
          </div>
        </div>
      );
    }

          <Volunteer tweaks={tweaks} bp={bp} />
          <Contact tweaks={tweaks} bp={bp} />
          <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} open={tweaksOpen} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
