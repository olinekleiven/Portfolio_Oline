<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oline Flatabø Kleiven — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #EDE0CF; color: #2A2620; font-family: 'DM Sans', sans-serif; overflow-x: hidden; }

    /* Custom pointer: a plain, neutral white dot that follows the mouse (see
       Cursor() in the script below). Native cursor is hidden everywhere;
       positioning is done with an un-transitioned transform so it tracks the
       mouse with zero lag — only the dot's own size/scale transitions. */
    * { cursor: none !important; }
    #pointer { position: fixed; top: 0; left: 0; width: 0; height: 0; pointer-events: none; z-index: 9999; }
    #pointer-dot {
      position: absolute; left: 0; top: 0;
      width: 16px; height: 16px; margin: -8px 0 0 -8px;
      border-radius: 50%; background: #fff;
      box-shadow: 0 2px 8px rgba(36,31,25,0.35);
      transition: width 0.25s cubic-bezier(.16,1,.3,1), height 0.25s cubic-bezier(.16,1,.3,1),
                  margin 0.25s cubic-bezier(.16,1,.3,1), background 0.25s ease,
                  box-shadow 0.25s ease, transform 0.15s ease, opacity 0.25s cubic-bezier(.16,1,.3,1);
    }
    #pointer.active #pointer-dot {
      width: 38px; height: 38px; margin: -19px 0 0 -19px;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 6px 18px rgba(36,31,25,0.3);
    }
    #pointer.click #pointer-dot { transform: scale(0.75); }
    /* Key cursor — shown while the Skills/toolbox section is in view and the
       toolbox is still closed (see Cursor() + useToolboxOpenGlobal below).
       Crossfades with the regular dot rather than replacing it abruptly. */
    #pointer-key {
      position: absolute; left: 0; top: 0;
      font-size: 46px; line-height: 1;
      transform: translate(-50%,-50%) scale(0.4) rotate(-25deg);
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(.16,1,.3,1), transform 0.25s cubic-bezier(.16,1,.3,1);
      pointer-events: none;
      user-select: none;
    }
    #pointer.key #pointer-dot { opacity: 0; transform: scale(0.3); }
    #pointer.key #pointer-key { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(-25deg); }
    /* Key-turn sequence — plays on the cursor's own key emoji, frozen over the
       toolbox latch (see Cursor()'s unlock effects + ToolboxClosed's
       handleOpen), so the cursor itself visually "does" the unlocking rather
       than the latch graphic animating on its own. Duration matches
       TOOLBOX_UNLOCK_MS (420ms) so it reads as one continuous motion with the
       toolboxLatchTurn/toolboxLatchSlide animations on the box itself. The
       transition above is overridden by this animation while '.unlocking' is
       present; '.key' stays applied throughout so the emoji (not the dot)
       stays visible. */
    @keyframes pointerKeyTurn {
      0%   { transform: translate(-50%,-50%) rotate(-25deg) scale(1); }
      35%  { transform: translate(-50%,-50%) rotate(15deg) scale(1.12); }
      70%  { transform: translate(-50%,-50%) rotate(60deg) scale(1.18); }
      100% { transform: translate(-50%,-50%) rotate(60deg) scale(1.15); }
    }
    #pointer.unlocking #pointer-key {
      animation: pointerKeyTurn 0.42s cubic-bezier(.4,0,.2,1) forwards;
    }
    @media (hover: none) {
      #pointer { display: none !important; }
      * { cursor: auto !important; }
    }

    /* Scroll reveal */
    .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s cubic-bezier(.16,1,.3,1), transform 0.8s cubic-bezier(.16,1,.3,1); }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-left { opacity: 0; transform: translateX(-40px); transition: opacity 0.9s cubic-bezier(.16,1,.3,1), transform 0.9s cubic-bezier(.16,1,.3,1); }
    .reveal-left.visible { opacity: 1; transform: translateX(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.35s; }
    .reveal-delay-4 { transition-delay: 0.5s; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #EDE0CF; }
    ::-webkit-scrollbar-thumb { background: #C04B22; border-radius: 2px; }

    /* Tweaks panel */
    #tweaks-panel { position: fixed; bottom: 24px; right: 24px; background: #2A2620; color: #EDE0CF; padding: 20px; border-radius: 12px; width: 240px; z-index: 9000; font-family: 'DM Sans', sans-serif; font-size: 13px; display: none; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    #tweaks-panel.open { display: block; }
    #tweaks-panel h4 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.5; margin-bottom: 16px; }
    .tweak-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .tweak-row label { opacity: 0.8; }
    .tweak-row input[type=color] { width: 28px; height: 28px; border: none; border-radius: 50%; cursor: pointer !important; background: none; padding: 0; }
    .tweak-row input[type=range] { width: 100px; accent-color: #C04B22; cursor: pointer !important; }
    .tweak-row select { background: #3A352F; color: #EDE0CF; border: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer !important; }

    /* Marquee */
    .marquee-track { display: flex; animation: marquee 28s linear infinite; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* Paper plane send animation. The trail (paperTrailReveal / paperTrailFade)
       reuses these exact same keyframe checkpoints so the two curves are
       mathematically identical in shape — the trail is given a small
       animation-delay in JS instead of different keyframe stops, so it always
       trails the plane by a fixed, precise amount rather than drifting. */
    @keyframes paperPlaneFly {
      0% { opacity: 0; offset-distance: 0%; }
      6% { opacity: 1; }
      70% { opacity: 1; offset-distance: 100%; }
      100% { opacity: 0; offset-distance: 100%; }
    }
    @keyframes paperTrailReveal {
      0% { stroke-dashoffset: 100; }
      70% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes paperTrailFade {
      0% { opacity: 0; }
      6% { opacity: 0.55; }
      70% { opacity: 0.55; }
      100% { opacity: 0; }
    }

    /* Toolbox — idle wobble on the closed box, to hint it's interactive */
    @keyframes toolboxWobble {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      20% { transform: rotate(-1.4deg) translateY(-2px); }
      50% { transform: rotate(1deg) translateY(0); }
      75% { transform: rotate(-0.6deg) translateY(-1px); }
    }
    .toolbox-wobble { animation: toolboxWobble 4.5s ease-in-out infinite; }
    .toolbox-wobble:hover, .toolbox-wobble:focus-visible { animation-play-state: paused; }

    /* Toolbox — the OPEN box's handle doubles as its close button; a soft
       resting glow (see ToolboxHandleArch) is the only hint it needs. */
    .toolbox-handle-btn:focus-visible {
      outline: 3px solid #fff; outline-offset: 4px; border-radius: 12px;
    }

    /* Toolbox — key-unlock sequence played on click, before the box swaps to
       its open state. The latch (keyhole plate) turns as if a key is
       twisting it, then the whole plate slides down and fades as the
       shackle "gives". Only ever applied when NOT reduced-motion — see
       ToolboxClosed's handleOpen, which skips this entirely otherwise. */
    @keyframes toolboxLatchTurn {
      0% { transform: translate(-50%,-50%) rotate(0deg); }
      55% { transform: translate(-50%,-50%) rotate(95deg); }
      100% { transform: translate(-50%,-50%) rotate(95deg); }
    }
    @keyframes toolboxLatchSlide {
      0%, 25% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
      70% { transform: translateX(-50%) translateY(8px) scale(0.85); opacity: 1; }
      100% { transform: translateX(-50%) translateY(14px) scale(0.6); opacity: 0; }
    }
    .toolbox-unlocking .toolbox-latch-hole { animation: toolboxLatchTurn 0.42s ease forwards; }
    .toolbox-unlocking .toolbox-latch { animation: toolboxLatchSlide 0.42s cubic-bezier(.4,0,.2,1) forwards; }
    .toolbox-tool:focus-visible, .toolbox-box:focus-visible {
      outline: 3px solid #fff; outline-offset: 3px;
    }
    /* .toolbox-close sits on light backgrounds (section bg / detail card), so a
       white outline is invisible there — use a dark outline instead. */
    .toolbox-close:focus-visible {
      outline: 3px solid #2A2620; outline-offset: 3px;
    }
    /* Carousel arrows sit on a dark photo-overlay gradient, so a white
       outline reads clearly there. */
    .carousel-arrow:focus-visible {
      outline: 2px solid #fff; outline-offset: 2px;
    }
    @keyframes toolboxTooltipIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .toolbox-tooltip { animation: toolboxTooltipIn 0.16s cubic-bezier(.16,1,.3,1); }

    /* Doodles — hand-drawn corner curves (hero + every section, see Doodles())
       and the little "spark" strokes beside the portrait/carousel. Lines use pathLength="1" so one dash keyframe
       draws any of them in, regardless of real length. */
    /* Dash pattern "1 2" + hidden offset 1.01 (not 1): with round caps, a
       zero-length dash sitting exactly at the path's start would still paint
       a dot, so the hidden state pushes it fully off the path. */
    @keyframes heroLineDraw { from { stroke-dashoffset: 1.01; } to { stroke-dashoffset: 0; } }
    @keyframes heroBlobIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes heroSparkBurst {
      0% { stroke-dashoffset: 1.01; transform: scale(0.92); }
      55% { stroke-dashoffset: 0; transform: scale(1.1); }
      100% { stroke-dashoffset: 0; transform: scale(1); }
    }
    /* Load sequence: top-left corner draws first, then bottom-right, and the
       portrait sparks pop last. */
    .doodle-line { stroke-dasharray: 1 2; stroke-dashoffset: 1.01; }
    .doodle-blob { opacity: 0; }
    .drawn .doodle-line { animation: heroLineDraw 0.55s cubic-bezier(.65,0,.35,1) 0.15s forwards; }
    .drawn .doodle-blob { animation: heroBlobIn 0.45s ease 0.05s forwards; }
    .drawn.doodle-second .doodle-line { animation-delay: 0.7s; }
    .drawn.doodle-second .doodle-blob { animation-delay: 0.6s; }
    /* Thread game (PageThread): handwritten notes, knots to untie, and the
       final ball of yarn. */
    .thread-note {
      position: absolute; transform: translate(-50%, -50%) rotate(var(--tilt, -3deg)) translateY(8px);
      font-family: 'Caveat', cursive; font-weight: 600; font-size: 24px; line-height: 1.1;
      color: var(--accent); text-align: center; white-space: nowrap;
      opacity: 0; pointer-events: none;
      /* Soft halo in the section's own background so notes stay legible
         where they pass over the thread */
      text-shadow: 0 0 3px var(--halo, var(--bg)), 0 0 8px var(--halo, var(--bg)), 0 0 14px var(--halo, var(--bg));
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(.16,1,.3,1);
    }
    /* Smaller handwriting on phones, where the notes share the width with content */
    @media (max-width: 639px) { .thread-note { font-size: 19px; } .thread-chip { font-size: 18px; } }
    .thread-note.shown { opacity: 1; transform: translate(-50%, -50%) rotate(var(--tilt, -3deg)); }
    .knot { position: absolute; transform: translate(-50%, -50%); }
    .knot-inner {
      position: relative; opacity: 0; transform: scale(0.3); pointer-events: none;
      transition: opacity 0.4s ease, transform 0.6s cubic-bezier(.34,1.56,.64,1);
    }
    .knot.reached .knot-inner { opacity: 1; transform: scale(1); pointer-events: auto; }
    .knot-btn {
      display: block; width: 74px; height: 74px; padding: 0; border: none; background: none;
      border-radius: 50%; cursor: pointer;
    }
    .knot-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .knot-scribble { transform-box: view-box; transform-origin: 37px 37px; animation: knotWobble 2.4s ease-in-out infinite; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1); }
    .knot-btn:hover .knot-scribble, .knot-btn:focus-visible .knot-scribble { animation-play-state: paused; transform: scale(1.12) rotate(8deg); }
    @keyframes knotWobble { 0%, 100% { transform: rotate(-5deg) scale(1); } 50% { transform: rotate(5deg) scale(1.05); } }
    .knot-loop { transform-box: view-box; transform-origin: 37px 37px; transition: transform 0.55s cubic-bezier(.6,0,.4,1), opacity 0.45s ease; }
    .knot[data-untied] .knot-loop { transform: rotate(var(--spin)) scale(0); opacity: 0; }
    .knot[data-untied] .knot-btn { pointer-events: none; }
    .knot .thread-note { transition-delay: 0.15s; }
    .knot.reached .thread-note { opacity: 1; transform: translate(-50%, -50%) rotate(var(--tilt, -3deg)); }
    .knot[data-untied] .thread-note.knot-ask { opacity: 0; transition-delay: 0s; }
    .knot .thread-note.knot-thanks { opacity: 0; }
    .knot[data-untied] .thread-note.knot-thanks { animation: knotThanks 1.8s ease forwards; }
    @keyframes knotThanks { 0% { opacity: 0; } 20%, 70% { opacity: 1; } 100% { opacity: 0; } }
    .thread-chip {
      position: fixed; left: 50%; bottom: 24px; z-index: 90;
      transform: translate(-50%, 140%); opacity: 0; pointer-events: none;
      background: #2A2620; color: #EDE0CF; border: 1.5px solid var(--accent);
      font-family: 'Caveat', cursive; font-size: 21px; padding: 8px 20px; border-radius: 100px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25); cursor: pointer;
      transition: transform 0.45s cubic-bezier(.16,1,.3,1), opacity 0.3s ease;
    }
    .thread-chip.shown { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
    .thread-chip:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    /* Two endings in Kontakt.
       - Players who untied every knot (.yarn-ready): a slot opens above the
         heading and the content waits; once the ball is wound, the content
         rises in beneath it, and "La oss snakke" gives way to the ball.
       - Everyone else (no or only some knots untied): the thread never gets
         this far, and Kontakt is exactly as it always was. */
    [data-yarn-slot] { height: 0; }
    #kontakt.yarn-ready [data-kontakt-label] { display: none; }
    /* Ball size matches YarnBallFinale (clamp(200px, 36vh, 340px)) + its note line above */
    #kontakt.yarn-ready [data-yarn-slot] { height: calc(clamp(200px, 36vh, 340px) + 64px); }
    /* On a phone: a smaller ball, with its note wrapping onto two lines above it */
    @media (max-width: 639px) { #kontakt.yarn-ready [data-yarn-slot] { height: calc(min(max(150px, 28vh), 55vw) + 100px); } }
    /* Compact layout for the yarn ending: the ball is the star, and ball,
       heading, text, buttons and footer all fit on one screen together */
    /* Top padding clears the fixed nav, so the centred block sits in what's actually visible */
    #kontakt.yarn-ready { padding-top: 92px !important; padding-bottom: 12px !important; }
    /* Nudge the whole block up a little: the empty space sits above it, not below */
    #kontakt.yarn-ready [data-yarn-content] { margin-top: -40px !important; }
    #kontakt.yarn-ready [data-yarn-content] h2 { font-size: clamp(28px, 3.2vw, 46px) !important; margin-bottom: 24px !important; }
    #kontakt.yarn-ready [data-yarn-content] h2 br { display: none; }
    /* The ball says it all — the intro sentence would only crowd it */
    #kontakt.yarn-ready [data-yarn-content] > p { display: none; }
    #kontakt.yarn-ready [data-thread-anchor="kontakt-actions"] { margin-bottom: 20px !important; }
    #kontakt.yarn-ready:not(.yarn-gathered) [data-yarn-content] .reveal { opacity: 0 !important; transform: translateY(30px) !important; }
    #kontakt.yarn-gathered [data-yarn-content] .reveal-delay-1 { transition-delay: 2.7s !important; }
    #kontakt.yarn-gathered [data-yarn-content] .reveal-delay-2 { transition-delay: 2.85s !important; }
    #kontakt.yarn-gathered [data-yarn-content] .reveal-delay-3 { transition-delay: 3s !important; }
    .yarn-ball-spin { transform-box: view-box; transform-origin: 100px 100px; animation: yarnSpin 1.3s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes yarnSpin { from { transform: rotate(320deg) scale(0.6); } to { transform: rotate(0deg) scale(1); } }
    .yarn-final-stroke { stroke-dasharray: 1 2; stroke-dashoffset: 1.01; animation: heroLineDraw 0.35s cubic-bezier(.45,.05,.35,1) forwards; }
    /* Handwritten reveal: a left-to-right wipe, as if the note is being written
       (the -30% insets leave room for Caveat's swashes and descenders) */
    .yarn-write { display: inline-block; clip-path: inset(-30% 100% -30% -2%); animation: yarnWrite 0.7s cubic-bezier(.45,.1,.55,.9) forwards; }
    @keyframes yarnWrite { to { clip-path: inset(-30% -4% -30% -2%); } }
    @media (prefers-reduced-motion: reduce) { .yarn-write { animation: none; clip-path: none; } }
    .yarn-final-msg { opacity: 0; animation: yarnMsgIn 0.8s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes yarnMsgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    /* Hobby doodles (HobbyDoodle) — gentle idle loops once a picture is drawn */
    @keyframes doodleBob { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
    @keyframes doodleSway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes doodlePulse { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
    .doodle-bob { animation: doodleBob 0.38s ease-in-out infinite alternate; }
    .doodle-sway { animation: doodleSway 2.4s ease-in-out infinite; }
    .doodle-pulse { animation: doodlePulse 1.4s ease-in-out infinite; }
    /* Lines driven by scroll (PageThread) — JS sets stroke-dashoffset inline */
    .doodle-line.scroll-line, .drawn .doodle-line.scroll-line { animation: none; }
    .hero-sparks line {
      stroke-dasharray: 1 2; stroke-dashoffset: 1.01;
      transform-box: view-box; transform-origin: 50px 50px;
      animation: heroSparkBurst 0.7s cubic-bezier(.16,1,.3,1) forwards;
    }
    .hero-sparks line:nth-child(2) { animation-delay: 0.07s; }
    .hero-sparks line:nth-child(3) { animation-delay: 0.14s; }
    .hero-sparks.intro line { animation-delay: 1.3s; }
    .hero-sparks.intro line:nth-child(2) { animation-delay: 1.37s; }
    .hero-sparks.intro line:nth-child(3) { animation-delay: 1.44s; }
    @media (prefers-reduced-motion: reduce) {
      .doodle-line, .doodle-blob, .hero-sparks line { animation: none; stroke-dashoffset: 0; opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .toolbox-wobble { animation: none; }
      .toolbox-box, .toolbox-tool, .toolbox-lid, .toolbox-panel, .toolbox-open-reveal { transition-duration: 0.01ms !important; }
      .toolbox-tooltip { animation-duration: 0.01ms !important; }
      .toolbox-latch, .toolbox-latch-hole { animation-duration: 0.01ms !important; }
      #pointer-key { animation-duration: 0.01ms !important; }
    }
    /* The diploma link is only shown via onMouseEnter/onMouseLeave hover state,
       which never fires on touch devices — so it would otherwise be permanently
       invisible and unclickable there. On true touch devices (no fine pointer
       to hover with) always show it, dimmed, instead of relying on hover. */
    @media (hover: none), (pointer: coarse) {
      .diploma-link {
        opacity: 0.75 !important;
        pointer-events: auto !important;
        color: var(--accent) !important;
      }
    }
  </style>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg">
      <rect width="80" height="56" fill="#f3e9dd"/>
      <circle cx="40" cy="22" r="10" fill="#C04B22" opacity="0.3"/>
      <rect x="16" y="36" width="48" height="3" rx="1.5" fill="#2A2620" opacity="0.2"/>
      <rect x="24" y="42" width="32" height="2" rx="1" fill="#C04B22" opacity="0.4"/>
    </svg>
  </template>
</head>
<body>
  <div id="pointer" aria-hidden="true">
    <div id="pointer-dot"></div>
    <div id="pointer-key">🔑</div>
  </div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#b95d3c",
      "bg": "#f5ead8",
      "dark": "#2A2620",
      "fontHeading": "Playfair Display",
      "spacing": 1.1
    }/*EDITMODE-END*/;


    // Text scramble hook
    const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    function useScramble(text, delay = 400) {
      const [display, setDisplay] = useState(text);
      useEffect(() => {
        let frame = 0, iter = 0;
        const timeout = setTimeout(() => {
          const interval = setInterval(() => {
            setDisplay(text.split('').map((ch, i) => {
              if (ch === ' ') return ' ';
              if (i < iter) return text[i];
              return CHARS[Math.floor(Math.random() * CHARS.length)];
            }).join(''));
            iter += 0.4;
            if (iter >= text.length) clearInterval(interval);
          }, 40);
        }, delay);
        return () => clearTimeout(timeout);
      }, [text]);
      return display;
    }

    // Magnetic button wrapper
    function MagBtn({ children, style, ...props }) {
      const ref = useRef(null);
      const handleMove = (e) => {
        const r = ref.current.getBoundingClientRect();
        const x = (e.clientX - r.left - r.width / 2) * 0.25;
        const y = (e.clientY - r.top - r.height / 2) * 0.25;
        ref.current.style.transform = `translate(${x}px, ${y}px)`;
      };
      const handleLeave = () => { ref.current.style.transform = 'translate(0,0)'; };

    // Skills marquee ticker
    const tickerItems = ['Figma', '✦', 'React', '✦', 'Brukertesting', '✦', 'Prototyping', '✦', 'Interaction Design', '✦', 'HTML / CSS / JS', '✦', 'Python', '✦', 'UX Research', '✦', 'Wireframing', '✦', 'mySQL', '✦'];

    // Custom pointer: moves the #pointer element 1:1 with the mouse (no
    // lerp/transition on position — that's what caused the old cursor to
    // visibly lag), and toggles the spark/click states via CSS classes.
    function Cursor() {
      const [skillsInView, setSkillsInView] = useState(false);
      const toolboxOpen = useToolboxOpenGlobal();
      const unlock = useToolboxUnlockGlobal();
      const showKey = skillsInView && !toolboxOpen;
      const unlockActiveRef = useRef(false);
      useEffect(() => { unlockActiveRef.current = unlock.active; }, [unlock.active]);

      useEffect(() => {
        const pointer = document.getElementById('pointer');
        const move = (e) => {
          // While the key-unlock sequence is playing, the cursor is frozen
          // over the latch (see the effect below) — ignore real mouse moves
          // so the key doesn't drift away from the lock mid-turn.
          if (unlockActiveRef.current) return;
          pointer.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
        };
        const over = () => pointer.classList.add('active');
        const out = () => pointer.classList.remove('active');
        let clickTimer;
        const down = () => {
          pointer.classList.add('click');
          clearTimeout(clickTimer);
          clickTimer = setTimeout(() => pointer.classList.remove('click'), 150);
        };
        document.addEventListener('mousemove', move);
        document.addEventListener('mousedown', down);
        document.querySelectorAll('a, button, [role="link"]').forEach(el => {
          el.addEventListener('mouseenter', over);
          el.addEventListener('mouseleave', out);
        });
        return () => {
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mousedown', down);
          clearTimeout(clickTimer);
        };
      }, []);

      // Swap to a key cursor while the Skills/toolbox section is in view and
      // the box is still locked — a hint that the box can be "unlocked".
      // Goes away the instant the box opens (or the section scrolls out).
      useEffect(() => {
        const skills = document.getElementById('skills');
        if (!skills) return;
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => setSkillsInView(e.isIntersecting));
        }, { threshold: 0.25 });
        obs.observe(skills);
        return () => obs.disconnect();
      }, []);

      useEffect(() => {
        const pointer = document.getElementById('pointer');
        if (!pointer) return;
        pointer.classList.toggle('key', showKey);
      }, [showKey]);

      // Freeze the cursor over the latch and play the key-turn animation
      // while unlocking is active; let it resume following the mouse (via a
      // plain class removal — the next real mousemove naturally snaps it
      // back) once the sequence finishes.
      useEffect(() => {
        const pointer = document.getElementById('pointer');
        if (!pointer) return;
        if (unlock.active) {
          pointer.style.transform = `translate3d(${unlock.x}px, ${unlock.y}px, 0)`;
          pointer.classList.add('unlocking');

          pointer.classList.remove('unlocking');

    // Touch-hover manager
    //
    // Native touch events only ever fire on the element a gesture *started*
    // on — a finger that scrolls/drags across other hover-styled elements
    // never triggers enter/leave there the way a mouse does. That means all
    // our onMouseEnter/onMouseLeave hover styling is invisible on touch
    // devices until the user commits to a tap on that exact element.
    //
    // To fix that, we track the finger's position globally (one listener on
    // window, throttled to one elementFromPoint() lookup per animation
    // frame so fast scrolling never gets janky) and look up which registered
    // hover-target it's currently over, toggling that target's hover state
    // explicitly — reconstructing mouseenter/mouseleave semantics for touch.
    // Purely additive: real mouse hover behaviour is completely untouched,
    // since this only ever reacts to touchstart/touchmove/touchend/touchcancel.
    const touchHoverRegistry = new Set();
    let touchHoverActive = null;
    let touchHoverRaf = null;

    function resolveTouchHoverTarget(x, y) {
      const el = document.elementFromPoint(x, y);
      let matched = null;
      for (const entry of touchHoverRegistry) {
        const node = entry.ref.current;
        if (node && el && (node === el || node.contains(el))) { matched = entry; break; }
      }
      if (matched !== touchHoverActive) {
        if (touchHoverActive) touchHoverActive.setActive(false);
        if (matched) matched.setActive(true);
        touchHoverActive = matched;
      }
    }

    function queueTouchHoverUpdate(x, y) {
      if (touchHoverRaf) cancelAnimationFrame(touchHoverRaf);
      touchHoverRaf = requestAnimationFrame(() => { touchHoverRaf = null; resolveTouchHoverTarget(x, y); });
    }

    function clearTouchHover() {
      if (touchHoverRaf) { cancelAnimationFrame(touchHoverRaf); touchHoverRaf = null; }
      if (touchHoverActive) { touchHoverActive.setActive(false); touchHoverActive = null; }
    }

    window.addEventListener('touchstart', e => { const t = e.touches[0]; if (t) queueTouchHoverUpdate(t.clientX, t.clientY); }, { passive: true });
    window.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) queueTouchHoverUpdate(t.clientX, t.clientY); }, { passive: true });
    window.addEventListener('touchend', clearTouchHover, { passive: true });
    window.addEventListener('touchcancel', clearTouchHover, { passive: true });

    // Register a DOM node (via the returned ref) as a touch-hover target.
    // Returns [ref, active] — active mirrors what onMouseEnter/onMouseLeave
    // would have been doing, but driven by the global touch tracker above.
    function useTouchHover() {
      const ref = useRef(null);
      const [active, setActive] = useState(false);
      useEffect(() => {
        const entry = { ref, setActive };
        touchHoverRegistry.add(entry);
        return () => {
          touchHoverRegistry.delete(entry);
          if (touchHoverActive === entry) touchHoverActive = null;
        };
      }, []);
      return [ref, active];
    }

    // Convenience wrapper for the many spots that mutate the DOM node
    // directly in onMouseEnter/onMouseLeave (rather than via React state):
    // replays the exact same handlers when touch-hover turns on/off, via a
    // minimal fake event ({ currentTarget, target }) so no handler logic
    // needs to be duplicated. Returns a ref to attach to the target node.
    function useTouchHoverStyle(onEnter, onLeave) {
      const [ref, active] = useTouchHover();
      useEffect(() => {
        const node = ref.current;
        if (!node) return;
        const fakeEvent = { currentTarget: node, target: node };
        if (active) onEnter(fakeEvent); else onLeave(fakeEvent);
      }, [active]);
      return ref;
    }

    // Toolbox-open global state
    //
    // Cursor() and Skills() are unrelated components with no shared props —
    // this is a tiny pub-sub, parallel to (but independent of)
    // touchHoverRegistry above, that lets Skills broadcast whether the
    // toolbox is open so Cursor can react (swap to the key cursor) without
    // any prop drilling.
    let toolboxOpenState = false;
    const toolboxOpenListeners = new Set();
    function setToolboxOpenGlobal(v) {
      toolboxOpenState = v;
      toolboxOpenListeners.forEach(fn => fn(v));
    }
    function useToolboxOpenGlobal() {
      const [v, setV] = useState(toolboxOpenState);
      useEffect(() => {
        toolboxOpenListeners.add(setV);
        return () => toolboxOpenListeners.delete(setV);
      }, []);
      return v;

    // ToolboxClosed broadcast the on-screen position of the latch (and
    // whether the unlock animation is currently playing) so Cursor can freeze
    // the key cursor there and play the turning animation on it — making the
    // cursor itself look like it's doing the unlocking, instead of two
    // unrelated animations happening in parallel. Independent of
    // toolboxOpenState/toolboxOpenListeners above.
    let toolboxUnlockPos = { active: false, x: 0, y: 0 };
    const toolboxUnlockListeners = new Set();
    function setToolboxUnlockGlobal(v) {
      toolboxUnlockPos = v;
      toolboxUnlockListeners.forEach(fn => fn(v));
    }
    function useToolboxUnlockGlobal() {
      const [v, setV] = useState(toolboxUnlockPos);
      useEffect(() => {
        toolboxUnlockListeners.add(setV);
        return () => toolboxUnlockListeners.delete(setV);
      }, []);

    // Corner doodle shapes, shared by the hero and every section's Doodles.
    // Drawn for the top-left / bottom-right corners; mirrored for the others.
    const DOODLE_TOP = {
      viewBox: '0 0 520 220',
      blob: 'M-20,-20 H520 C470,55 400,92 300,104 C180,118 80,142 -20,190 Z',
      line: 'M-20,214 C110,200 225,148 300,84 C332,56 352,28 372,-20'
    };
    const DOODLE_BOTTOM = {
      viewBox: '0 0 540 240',
      blob: 'M560,92 C500,80 420,70 340,86 C220,110 150,170 190,212 C232,250 420,236 560,226 Z',
      line: 'M560,-6 C520,30 490,62 445,96 C372,148 262,182 168,238'
    };
    function DoodleSvg({ shape, tweaks, onDark, threadId, side }) {
      return (
        <svg viewBox={shape.viewBox} style={{ display: 'block', width: '100%', height: 'auto', overflow: 'visible' }}>
          <path className="doodle-blob" d={shape.blob} fill={onDark ? `${tweaks.bg}0a` : `${tweaks.dark}0c`} />
          <ThreadStroke className="doodle-line" d={shape.line} layer={`line:${threadId}`} tweaks={tweaks}
            main={{ 'data-thread': threadId, 'data-side': side }} />
        </svg>
      );
    }

    // The thread, drawn like a real cord: a soft shadow, the body, twisted
    // strands (#thread-twist) and a thin sheen on top. Only the body carries
    // the data-* hooks that get measured; the other layers are found by
    // `data-thread-layer` and drawn on in step with it.
    function ThreadStroke({ d, className, layer, main, tweaks }) {
      const common = { className, d, pathLength: 1, fill: 'none', strokeLinecap: 'round' };
      return (
        <>
          <path {...common} data-thread-layer={layer} stroke={tweaks.dark} strokeOpacity="0.16" strokeWidth="3.8" transform="translate(0.5 1.4)" />
          <path {...common} {...main} stroke={tweaks.accent} strokeWidth="2.8" />
          <path {...common} data-thread-layer={layer} stroke="url(#thread-twist)" strokeWidth="2.8" />
          <path {...common} data-thread-layer={layer} stroke="#fff" strokeOpacity="0.28" strokeWidth="0.7" transform="translate(0 -0.6)" />
        </>
      );
    }

    // True once the element's top has scrolled ~30% up into the viewport
    // (never flips back). A rootMargin rather than a ratio threshold, so very
    // tall sections still trigger.
    function useInViewOnce(ref) {
      const [inView, setInView] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el || inView) return;
        const obs = new IntersectionObserver(entries => {
          if (entries.some(e => e.isIntersecting)) { setInView(true); obs.disconnect(); }
        }, { rootMargin: '0px 0px -30% 0px' });
        obs.observe(el);
        return () => obs.disconnect();
      }, [inView]);
      return inView;
    }

    // Section doodle: one small, self-contained mark (soft half-moon + a
    // single hand-drawn sweep across it) hugging a side edge near the section's lower
    // part. It never touches the section's top/bottom edge, so nothing gets
    // cut off where two sections meet. Drawn for the right edge; mirrored for
    // the left. Sits behind content (zIndex -1) — the section needs
    // position: relative + isolation.
    const DOODLE_SIDE = {
      viewBox: '0 0 200 260',
      blob: 'M200,28 C146,36 104,78 94,132 C84,184 124,230 200,244 Z',
      line: 'M200,10 C158,34 128,74 104,122 C80,170 48,204 10,220'
    };
    function Doodles({ tweaks, bp, side = 'right', onDark = false, threadId, bare = false }) {
      const ref = useRef(null);
      const inView = useInViewOnce(ref);
      return (
        <div ref={ref} aria-hidden="true" data-doodle-layer={threadId} style={{
          position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none', zIndex: -1
        }}>
          {!bare && (
            <div className={inView ? 'drawn' : ''} style={{

            </div>
          )}

      );
    }

    // Hero
    function Hero({ tweaks, bp }) {
      const scrambled = useScramble('Oline Flatabø Kleiven', 600);
      const reducedMotion = usePrefersReducedMotion();
      const portraitRef = React.useRef(null);
      const heroPrimaryEnter = e => { e.target.style.transform = 'translateY(-2px)'; };
      const heroPrimaryLeave = e => { e.target.style.transform = 'translateY(0)'; };
      const heroPrimaryTouchRef = useTouchHoverStyle(heroPrimaryEnter, heroPrimaryLeave);
      const heroCvEnter = e => { e.currentTarget.style.background = tweaks.dark; e.currentTarget.style.color = tweaks.bg; e.currentTarget.style.borderColor = tweaks.dark; e.currentTarget.style.transform = 'translateY(-2px)'; };
      const heroCvLeave = e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = tweaks.dark; e.currentTarget.style.borderColor = tweaks.dark+'40'; e.currentTarget.style.transform = 'translateY(0)'; };
      const heroCvTouchRef = useTouchHoverStyle(heroCvEnter, heroCvLeave);

      // Parallax on the portrait, driven directly on the DOM node (no React
      // re-render per scroll event) and batched to one update per animation
      // frame so it stays smooth even with many other scroll/reveal listeners
      // on the page. Purely decorative, so it's skipped entirely when the
      // user prefers reduced motion.
      React.useEffect(() => {
        if (reducedMotion || bp.isMobile) return;
        let rafId = null;
        const applyParallax = () => {
          rafId = null;
          const el = portraitRef.current;

        };

          if (rafId === null) rafId = window.requestAnimationFrame(applyParallax);
        };
        applyParallax();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => {
          window.removeEventListener('scroll', onScroll);
          if (rafId !== null) window.cancelAnimationFrame(rafId);
        };
      }, [reducedMotion, bp.isMobile]);

      // The top-left corner doodle drifts a few px with the mouse so the page
      // feels alive. The bottom-right one stays put: PageThread continues
      // its line down the page and they must keep meeting exactly.
      const cornerTLRef = React.useRef(null);

          ['M130,10 A20,20 0 1,1 129.9,10', 0.4],
          ['M112,36 C116,14 146,10 149,26 C151,42 128,52 113,42', 0.3],
          ['M117,18 C131,27 141,40 137,48', 0.22],
          ['M125,11 C135,21 147,28 150,33', 0.22],
          ['M111,27 C124,29 139,35 146,44', 0.22],
          ['M118,46 C124,36 136,24 146,18', 0.22],
        ],
        fill: { cx: 130, cy: 30, r: 20 },
        from: 'rotate(160deg)', origin: '130px 30px',
      },
    };
    function HobbyDoodle({ doodle, active, tweaks }) {
      const reducedMotion = usePrefersReducedMotion();
      const ease = 'cubic-bezier(.45,.05,.35,1)';
      // Sequential start times, each stroke overlapping the last a little
      const timed = [];
      let t = 0;
      doodle.strokes.forEach(([d, dur]) => { timed.push({ d, dur, delay: t }); t += dur * 0.8; });
      const total = t + 0.1;
      const RESET = 0.25; // leave: fade out first, then snap strokes back unseen
      const stroke = ({ d, dur, delay }, i) => (
        <path key={i} d={d} pathLength="1" fill="none" stroke={tweaks.accent}
          strokeWidth={i === 0 ? 1.8 : 1.6} strokeLinecap="round" strokeLinejoin="round"
          style={{
            strokeDasharray: '1 2',
            strokeDashoffset: active ? 0 : 1.01,
            transition: reducedMotion ? 'none'
              : active ? `stroke-dashoffset ${dur}s ${ease} ${delay}s` : `stroke-dashoffset 0s linear ${RESET}s`
          }} />
      );
      const [thread, ...figure] = timed;
      const vb = { transformBox: 'view-box', transformOrigin: doodle.origin || '130px 30px' };
      return (
        <svg aria-hidden="true" viewBox="0 0 160 60" style={{
          position: 'absolute', right: 0, top: '50%', transform: 'translateY(-50%)',
          width: 'min(160px, 34%)', height: 'auto',
          overflow: 'visible', pointerEvents: 'none',
          opacity: active ? 1 : 0,
          transition: reducedMotion ? 'none' : `opacity ${active ? 0.1 : 0.22}s ease`
        }}>
          {stroke(thread, 0)}
          <g style={{
            ...vb,
            transform: doodle.from && !active ? doodle.from : 'none',
            transition: reducedMotion ? 'none'
              : active ? `transform ${total}s cubic-bezier(.16,1,.3,1) 0.2s` : `transform 0s linear ${RESET}s`
          }}>
            <g className={active && doodle.loop && !reducedMotion ? doodle.loop : ''}
              style={{ ...vb, animationDelay: `${total}s` }}>
              {doodle.fill && (
                <circle cx={doodle.fill.cx} cy={doodle.fill.cy} r={doodle.fill.r} fill={tweaks.accent} style={{
                  opacity: active ? 0.12 : 0,
                  transition: reducedMotion ? 'none' : `opacity 0.4s ease ${active ? 0.5 : 0}s`
                }} />
              )}
              {figure.map((f, i) => stroke(f, i + 1))}
            </g>
          </g>
        </svg>
      );
    }

    // A tiny hover/press/touch-aware arrow button, living inside the bottom
    // overlay bar. Mirrors the hov+touchHover pattern used by HobbyRow.
    function CarouselArrow({ dir, onGo, reducedMotion, children, label }) {
      const [hov, setHov] = useState(false);
      const [pressed, setPressed] = useState(false);
      const [touchRef, touchHover] = useTouchHover();
      useEffect(() => { setHov(touchHover); }, [touchHover]);
      const scale = pressed ? 0.86 : hov ? 1.1 : 1;
      return (
        <button
          ref={touchRef}
          className="carousel-arrow"
          onClick={() => onGo(dir)}
          aria-label={label}
          onMouseEnter={() => setHov(true)}
          onMouseLeave={() => { setHov(false); setPressed(false); }}
          onMouseDown={() => setPressed(true)}
          onMouseUp={() => setPressed(false)}
          onTouchStart={() => setPressed(true)}
          onTouchEnd={() => setPressed(false)}
          style={{
            width: 34, height: 34, borderRadius: '50%', border: 'none', cursor: 'pointer',
            background: hov || pressed ? 'rgba(255,255,255,0.32)' : 'rgba(255,255,255,0.18)',
            color: '#fff', flexShrink: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            transform: `scale(${scale})`,
            transition: reducedMotion ? 'none' : 'transform 0.15s cubic-bezier(.16,1,.3,1), background 0.2s ease'
          }}
        >{children}</button>
      );
    }

    // Left-side portrait, now a small photo browser — starts on the plain
    // portrait, then flips through every photo Oline supplied (GALLERY),
    // one at a time, via the overlay controls baked into the image itself.
    // Drag (or arrow-key) handle on the carousel's right edge, letting the
    // viewer pull the frame wider/narrower themselves. Pointer capture keeps
    // the drag tracking even once the cursor leaves the small handle.
    function ResizeHandle({ width, setWidth, minWidth, maxWidth, tweaks }) {
      const dragRef = useRef(null);
      const [active, setActive] = useState(false);
      const onPointerDown = e => {
        e.currentTarget.setPointerCapture(e.pointerId);
        dragRef.current = { startX: e.clientX, startWidth: width };
        setActive(true);
      };
      const onPointerMove = e => {
        if (!dragRef.current) return;
        const delta = e.clientX - dragRef.current.startX;
        setWidth(Math.round(Math.min(maxWidth, Math.max(minWidth, dragRef.current.startWidth + delta))));
      };
      const endDrag = e => {
        dragRef.current = null;
        setActive(false);
        try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
      };
      const onKeyDown = e => {
        if (e.key === 'ArrowLeft') { setWidth(w => Math.max(minWidth, w - 16)); e.preventDefault(); }
        if (e.key === 'ArrowRight') { setWidth(w => Math.min(maxWidth, w + 16)); e.preventDefault(); }
      };
      return (
        <div
          role="slider"
          tabIndex={0}
          aria-label="Endra biletbreidde"
          aria-valuemin={minWidth}
          aria-valuemax={maxWidth}
          aria-valuenow={Math.round(width)}
          onPointerDown={onPointerDown}
          onPointerMove={onPointerMove}
          onPointerUp={endDrag}
          onPointerCancel={endDrag}
          onKeyDown={onKeyDown}
          style={{
            position: 'absolute', top: '50%', right: -12, transform: 'translateY(-50%)',
            width: 22, height: 46, borderRadius: 11, cursor: 'ew-resize', touchAction: 'none',
            background: active ? tweaks.accent : `${tweaks.dark}30`,
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 2,
            transition: 'background 0.2s ease', zIndex: 6
          }}
        >
          {[0, 1].map(i => (
            <span key={i} aria-hidden="true" style={{
              width: 2.5, height: 16, borderRadius: 2, background: tweaks.bg, opacity: 0.9
            }} />
          ))}
        </div>
      );
    }

    function PhotoCarousel({ tweaks, bp }) {
      const reducedMotion = usePrefersReducedMotion();
      const cards = GALLERY;
      const idxRef = useRef(0);
      const [dispIdx, setDispIdx] = useState(0);
      const [visible, setVisible] = useState(true);

      // Only the width is adjustable: the height stays locked to the default
      // 3:4 portrait, so dragging wider reveals more of landscape photos
      // instead of scaling the whole frame up. Max = whatever the column allows.
      const startWidth = bp.isMobile ? 300 : 340;
      const frameHeight = Math.round(startWidth * 4 / 3);
      const minWidth = 200;
      const wrapRef = useRef(null);
      const [maxWidth, setMaxWidth] = useState(startWidth);
      const [width, setWidth] = useState(startWidth);
      useEffect(() => {
        const col = wrapRef.current && wrapRef.current.parentElement;
        if (!col) return;
        const measure = () => {
          const m = Math.max(minWidth, col.clientWidth);
          setMaxWidth(m);
          setWidth(w => Math.min(w, m));
        };
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(col);
        return () => ro.disconnect();
      }, []);

      const go = dir => {
        const next = (idxRef.current + dir + cards.length) % cards.length;
        if (reducedMotion) { idxRef.current = next; setDispIdx(next); return; }
        setVisible(false);
        window.setTimeout(() => {
          idxRef.current = next;
          setDispIdx(next);
          requestAnimationFrame(() => setVisible(true));
        }, 110);
      };

      // Under object-fit: cover a photo renders at whichever is larger: the
      // frame's width, or its height scaled by the photo's aspect ratio
      const frameW = Math.min(width, maxWidth);
      const sizesFor = c => `${Math.round(Math.max(frameW, frameHeight * c.aspect))}px`;

      // Warm the cache for the photos either side, so stepping through the
      // carousel never waits on a download
      useEffect(() => {
        [1, -1].forEach(dir => {
          const c = cards[(dispIdx + dir + cards.length) % cards.length];
          const im = new Image();
          im.sizes = sizesFor(c);
          im.srcset = c.srcset;
          im.src = c.img;
        });
      }, [dispIdx, frameW]);

      const card = cards[dispIdx];
      return (
        <div ref={wrapRef} className="reveal" style={{ marginBottom: 24, position: 'relative', width: Math.min(width, maxWidth) }}>
          <div
            data-thread-anchor="carousel"
            role="group"
            aria-label={`Biletgalleri, bilete ${dispIdx + 1} av ${cards.length}`}
            style={{
              position: 'relative', width: '100%', height: frameHeight,
              borderRadius: 20, overflow: 'hidden', border: `3px solid ${tweaks.accent}60`,
              background: `${tweaks.dark}08`
            }}
          >
            <img
              src={card.img}
              srcSet={card.srcset}
              sizes={sizesFor(card)}
              decoding="async"
              alt={card.label ? `Oline driv med ${card.label.toLowerCase()}` : 'Portrett av Oline'}
              style={{
                width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center top',
                opacity: visible ? 1 : 0,
                transform: visible ? 'scale(1)' : 'scale(1.02)',
                transition: reducedMotion ? 'none' : (visible
                  ? 'opacity 0.22s cubic-bezier(.16,1,.3,1), transform 0.22s cubic-bezier(.16,1,.3,1)'
                  : 'opacity 0.11s cubic-bezier(.4,0,1,1)')
              }}
            />
            <div style={{
              position: 'absolute', left: 0, right: 0, bottom: 0,
              background: 'linear-gradient(transparent, rgba(20,15,10,0.6))',
              padding: '30px 10px 10px',
              display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8
            }}>
              <CarouselArrow dir={-1} onGo={go} reducedMotion={reducedMotion} label="Førre bilete">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </CarouselArrow>
              <span aria-live="polite" aria-atomic="true" style={{
                fontSize: 12, color: '#fff', textAlign: 'center',
                opacity: reducedMotion ? 1 : (visible ? 1 : 0), transition: reducedMotion ? 'none' : 'opacity 0.12s ease'
              }}>
                {card.label || 'Oline'} <span style={{ opacity: 0.65 }}>· {dispIdx + 1}/{cards.length}</span>
              </span>
              <CarouselArrow dir={1} onGo={go} reducedMotion={reducedMotion} label="Neste bilete">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </CarouselArrow>
            </div>
          </div>
          <ResizeHandle width={Math.min(width, maxWidth)} setWidth={setWidth} minWidth={minWidth} maxWidth={maxWidth} tweaks={tweaks} />
        </div>
      );
    }

    const BOOK_WIDTHS = [82, 70, 90, 76, 86, 74];
    const BOOK_HEIGHTS = [330, 352, 314, 342, 322, 336];
    const BOOK_TILT = [-1.4, 1.1, -0.7, 1.6, -1.1, 0.9];
    const PAGE_EDGE = '#F3E9D8';
    const BOOK_GOLD = '#E2C27D';

    function Book({ project, index, tweaks, mobile, onOpen }) {
      const [hov, setHov] = useState(false);
      const [bookTouchRef, bookTouchHover] = useTouchHover();
      useEffect(() => { setHov(bookTouchHover); }, [bookTouchHover]);
      const scale = mobile ? 0.8 : 1;
      // The featured book is bigger, stands up straight and is gold-tooled
      const featured = !!project.featured;
      const w = Math.round((featured ? 104 : BOOK_WIDTHS[index % BOOK_WIDTHS.length]) * scale);
      const h = Math.round((featured ? 372 : BOOK_HEIGHTS[index % BOOK_HEIGHTS.length]) * scale);
      const tilt = featured ? 0 : BOOK_TILT[index % BOOK_TILT.length];
      const band = featured ? BOOK_GOLD : 'rgba(255,255,255,0.45)';
      const pageW = Math.max(5, Math.round(w * 0.09));
      return (
        <button
          ref={bookTouchRef}
          onClick={() => onOpen(project)}
          onMouseEnter={() => setHov(true)}
          onMouseLeave={() => setHov(false)}
          onFocus={() => setHov(true)}
          onBlur={() => setHov(false)}
          aria-label={`Opne prosjektet ${project.title}`}
          style={{
            width: w, height: h, flexShrink: 0,
            border: 'none', borderRadius: '2px 4px 4px 2px', padding: 0, cursor: 'pointer',
            background: `linear-gradient(90deg, rgba(0,0,0,0.4) 0%, rgba(255,255,255,0.16) 6%, transparent 16%, transparent 88%), ${project.color}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            position: 'relative', transformOrigin: 'bottom center', zIndex: hov ? 5 : 1,
            transform: hov ? `rotate(${tilt * 0.45}deg) translateY(-9px)` : `rotate(${tilt}deg) translateY(0)`,
            boxShadow: hov ? '5px 12px 20px rgba(20,15,10,0.4)' : '2px 6px 10px rgba(20,15,10,0.28)',
            transition: 'transform 0.3s cubic-bezier(.16,1,.3,1), box-shadow 0.3s ease'
          }}
        >
          {/* page block, visible on the right edge of the spine */}
          <div style={{
            position: 'absolute', top: 2, right: 0, bottom: 2, width: pageW,
            background: `repeating-linear-gradient(180deg, ${PAGE_EDGE} 0px, ${PAGE_EDGE} 2px, #E4D6BE 2px, #E4D6BE 3px)`,
            borderRadius: '0 3px 3px 0', boxShadow: 'inset 2px 0 3px rgba(0,0,0,0.25)'
          }} />
          {/* headband / tailband (doubled in gold on the featured book) */}
          <div style={{ position: 'absolute', top: '10%', left: 0, right: pageW, height: 3, background: band }} />
          <div style={{ position: 'absolute', bottom: '10%', left: 0, right: pageW, height: 3, background: band }} />
          {featured && <>
            <div style={{ position: 'absolute', top: 'calc(10% + 7px)', left: 0, right: pageW, height: 1, background: band }} />
            <div style={{ position: 'absolute', bottom: 'calc(10% + 7px)', left: 0, right: pageW, height: 1, background: band }} />
            <span aria-hidden="true" style={{ position: 'absolute', top: '4%', left: 0, right: pageW, textAlign: 'center', color: BOOK_GOLD, fontSize: mobile ? 11 : 13 }}>✦</span>
          </>}
          {/* bookmark ribbon */}
          <div style={{
            position: 'absolute', top: -8, left: '58%', width: Math.max(6, Math.round(w * 0.1)), height: 22,
            background: featured ? tweaks.accent : 'rgba(255,255,255,0.55)', clipPath: 'polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%)'
          }} />
          {featured && (
            <span aria-hidden="true" style={{
              position: 'absolute', bottom: '100%', left: '50%', transform: 'translate(-50%, -14px) rotate(-6deg)',
              fontFamily: "'Caveat', cursive", fontWeight: 600, fontSize: mobile ? 18 : 21,
              color: BOOK_GOLD, whiteSpace: 'nowrap', pointerEvents: 'none'
            }}>Start her!</span>
          )}
          <span style={{
            writingMode: 'vertical-rl', transform: 'rotate(180deg)',
            fontFamily: tweaks.fontHeading, fontStyle: 'italic', fontWeight: 400,
            fontSize: featured ? (mobile ? 15 : 17) : (mobile ? 13 : 15), color: featured ? BOOK_GOLD : '#fff', letterSpacing: '0.01em',
            maxHeight: '74%', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
            marginRight: pageW * 0.4
          }}>{project.spineTitle || project.title}</span>
        </button>
      );
    }

    function BookModal({ project, onClose, tweaks, mobile }) {
      const [shown, setShown] = useState(false);
      const closeBtnEnter = e => { e.currentTarget.style.background = 'rgba(42,38,32,0.16)'; };
      const closeBtnLeave = e => { e.currentTarget.style.background = 'rgba(42,38,32,0.08)'; };
      const closeBtnTouchRef = useTouchHoverStyle(closeBtnEnter, closeBtnLeave);
      useEffect(() => {
        const raf = requestAnimationFrame(() => setShown(true));
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener('keydown', onKey);
          document.body.style.overflow = prevOverflow;
        };
      }, []);
      return (
        <div
          onClick={onClose}
          style={{
            position: 'fixed', inset: 0, zIndex: 200,
            background: `rgba(20,15,10,${shown ? 0.62 : 0})`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            padding: mobile ? 16 : 40, transition: 'background 0.35s ease'
          }}
        >
          <div
            onClick={e => e.stopPropagation()}
            style={{
              width: '100%', maxWidth: 880, maxHeight: '86vh',
              background: '#FBF6EC', borderRadius: 10,
              boxShadow: '0 40px 80px rgba(0,0,0,0.4)', position: 'relative',
              transform: shown ? 'scale(1)' : 'scale(0.88)', opacity: shown ? 1 : 0,
              transition: 'transform 0.35s cubic-bezier(.16,1,.3,1), opacity 0.3s ease'
            }}
          >
            <button
              ref={closeBtnTouchRef}
              className="toolbox-close"
              onClick={onClose} aria-label="Lukk"
              style={{
                position: 'absolute', top: 16, right: 16, width: 36, height: 36, borderRadius: '50%',
                border: 'none', background: 'rgba(42,38,32,0.08)', color: '#2A2620',
                fontSize: 15, cursor: 'pointer', zIndex: 2, transition: 'background 0.2s ease'
              }}
              onMouseEnter={closeBtnEnter}
              onMouseLeave={closeBtnLeave}
            >✕</button>

            <div style={{
              display: 'flex', flexDirection: mobile ? 'column' : 'row',
              maxHeight: '86vh', overflow: 'auto', borderRadius: 10
            }}>
              <div style={{
                flex: mobile ? 'none' : 1, padding: mobile ? '36px 24px 16px' : '56px 48px',
                borderRight: mobile ? 'none' : `1px solid ${project.color}20`,
                borderBottom: mobile ? `1px solid ${project.color}20` : 'none'
              }}>
                <span style={{ fontFamily: tweaks.fontHeading, fontSize: 44, color: project.color + '40', fontWeight: 400, lineHeight: 1 }}>{project.num}</span>
                <p style={{ fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 600, color: project.color, marginTop: 16, marginBottom: 8 }}>{project.subtitle}</p>
                <h3 style={{ fontFamily: tweaks.fontHeading, fontStyle: 'italic', fontSize: mobile ? 26 : 38, color: '#2A2620', marginBottom: 20, lineHeight: 1.15 }}>{project.title}</h3>
                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                  {project.url && (
                    <a href={project.url} target="_blank" rel="noopener" style={{
                      display: 'inline-flex', alignItems: 'center', gap: 8,
                      padding: '10px 20px', borderRadius: 100,
                      background: project.color, color: '#fff', textDecoration: 'none',
                      fontSize: 13, fontWeight: 500
                    }}>Prosjektet ↗</a>
                  )}
                  {project.extraLink && (
                    <a href={project.extraLink.url} target="_blank" rel="noopener" style={{
                      display: 'inline-flex', alignItems: 'center', gap: 8,
                      padding: '10px 20px', borderRadius: 100,
                      background: 'transparent', color: project.color, textDecoration: 'none',
                      border: `1.5px solid ${project.color}50`,
                      fontSize: 13, fontWeight: 500
                    }}>{project.extraLink.label} ↗</a>
                  )}
                </div>
                {project.note && (
                  <div style={{ marginTop: 4, paddingLeft: 16, borderLeft: `2px solid ${project.color}30` }}>
                    <p style={{ fontSize: 15, lineHeight: 1.75, color: '#2A2620', opacity: 0.75 }}>{project.note}</p>
                    {project.noteHand && (
                      <p style={{ fontFamily: "'Caveat', cursive", fontWeight: 600, fontSize: mobile ? 24 : 28, color: tweaks.accent, marginTop: 10, transform: 'rotate(-2deg)', transformOrigin: 'left center' }}>{project.noteHand}</p>
                    )}
                  </div>
                )}
              </div>

              <div style={{ flex: mobile ? 'none' : 1, padding: mobile ? '4px 24px 36px' : '56px 48px' }}>
                {project.video && (
                  <video controls preload="metadata" playsInline
                    style={{ width: '100%', borderRadius: 10, marginBottom: 24, display: 'block', background: '#000' }}>
                    <source src={project.video} />
                  </video>
                )}
                <p style={{ fontSize: 15, lineHeight: 1.75, color: '#2A2620', opacity: 0.75, marginBottom: 24 }}>{project.desc}</p>
                {project.steps && (
                  <ol style={{ listStyle: 'none', padding: 0, margin: '0 0 28px' }}>
                    {project.steps.map((st, i) => (
                      <li key={st.title} style={{ display: 'flex', gap: 14, paddingBottom: i < project.steps.length - 1 ? 18 : 0, position: 'relative' }}>
                        {/* numbered dot on a line running down the steps */}
                        {i < project.steps.length - 1 && <span aria-hidden="true" style={{ position: 'absolute', left: 13, top: 28, bottom: 0, width: 1.5, background: project.color + '30' }} />}
                        <span aria-hidden="true" style={{
                          flexShrink: 0, width: 28, height: 28, borderRadius: '50%', background: project.color, color: BOOK_GOLD,
                          display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 600
                        }}>{i + 1}</span>
                        <div style={{ paddingTop: 3 }}>
                          <p style={{ fontSize: 15, fontWeight: 600, color: '#2A2620', marginBottom: 4 }}>{st.title}</p>
                          <p style={{ fontSize: 14, lineHeight: 1.7, color: '#2A2620', opacity: 0.75 }}>{st.text}</p>
                        </div>
                      </li>
                    ))}
                  </ol>
                )}
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                  {project.tags.map(tag => (
                    <span key={tag} style={{
                      padding: '6px 14px', borderRadius: 100, fontSize: 12, fontWeight: 500,
                      background: project.color + '14', color: project.color,
                      border: `1px solid ${project.color}30`
                    }}>{tag}</span>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

          }}>

                <Book key={p.num} project={p} index={i - projects.slice(0, i).filter(q => q.featured).length} tweaks={tweaks} mobile={mobile} onOpen={setOpenProject} />

        }}>

    function usePrefersReducedMotion() {
      const [reduced, setReduced] = useState(false);
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        setReduced(mq.matches);
        const handler = (e) => setReduced(e.matches);
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, []);
      return reduced;
    }

    // The handle is purely decorative on the closed box (the whole box is
    // already the open-trigger), but on the OPEN box it doubles as the close
    // control — pass onClose to make it a real, obviously-pressable button
    // instead of a floating ✕ elsewhere on the card.
    function ToolboxHandleArch({ width, height, borderWidth, color, onClose }) {
      const [hov, setHov] = useState(false);
      const [handleTouchRef, handleTouchHover] = useTouchHover();
      useEffect(() => { if (onClose) setHov(handleTouchHover); }, [handleTouchHover, onClose]);

      // A gentle lift, not a full colour swap to the accent — just enough to
      // read as "this responds to you", same size and shape either way.
      const archColor = onClose && hov ? '#5C4128' : color;
      const sharedStyle = {
        position: 'absolute', top: 0, left: '50%', transform: 'translateX(-50%)',
        width, height, border: `${borderWidth}px solid ${archColor}`, borderBottom: 'none',
        borderRadius: '50% 50% 0 0',
      };

      if (!onClose) {
        return <div aria-hidden="true" style={{ ...sharedStyle, zIndex: 0, pointerEvents: 'none' }} />;
      }

      // Looks exactly like the plain decorative arch (same size, same z-index
      // — tucked behind the box, nothing added in front of the tools) with
      // only the border colour shifting a touch on hover/touch as the hint
      // that it's pressable. No filter/glow — Safari renders a filtered
      // <button> with its opaque default background instead of the intended
      // transparent one, which is what produced the black block before.
      return (
        <button
          ref={handleTouchRef}
          onClick={onClose}
          onMouseEnter={() => setHov(true)}
          onMouseLeave={() => setHov(false)}
          aria-label="Lukk verktøykassa"
          className="toolbox-handle-btn"
          style={{
            ...sharedStyle, zIndex: 0, background: 'transparent', padding: 0, margin: 0,
            cursor: 'pointer', WebkitAppearance: 'none', appearance: 'none',
            transition: 'border-color 0.25s ease'
          }}
        />
      );
    }

    // Duration of the key-unlock sequence (latch turn + slide) — kept in one
    // place so the CSS animation lengths (toolboxLatchTurn/toolboxLatchSlide,
    // both 0.42s) and the JS delay before actually swapping to the open
    // stage always stay in sync.
    const TOOLBOX_UNLOCK_MS = 420;

    function ToolboxClosed({ onOpen, mobile, reducedMotion, tweaks }) {
      const [hov, setHov] = useState(false);
      const [unlocking, setUnlocking] = useState(false);
      const [boxTouchRef, boxTouchHover] = useTouchHover();
      const latchRef = useRef(null);
      useEffect(() => { setHov(boxTouchHover); }, [boxTouchHover]);
      const boxH = mobile ? 150 : 260;

      // Works identically whether triggered by a click or by keyboard
      // (Enter/Space) activation of the button — getBoundingClientRect() on
      // the latch reads its current on-screen position either way, so the
      // event itself is never needed as a position source.
      const handleOpen = () => {
        if (unlocking) return; // already mid-sequence — ignore repeat activation
        if (reducedMotion) { onOpen(); return; }
        if (latchRef.current) {
          const r = latchRef.current.getBoundingClientRect();
          setToolboxUnlockGlobal({ active: true, x: r.left + r.width / 2, y: r.top + r.height / 2 });
        }
        setUnlocking(true);
        setTimeout(() => {
          setToolboxUnlockGlobal({ active: false, x: 0, y: 0 });
          onOpen();
        }, TOOLBOX_UNLOCK_MS);
      };

      return (
        <div style={{ width: '100%', maxWidth: mobile ? 400 : 900, margin: '0 auto', textAlign: 'center' }}>
          <div
            className={reducedMotion ? '' : 'toolbox-wobble'}

              onClick={handleOpen}

              onMouseLeave={() => setHov(false)}
              aria-label="Opne verktøykassa — sjå verktøya og metodane mine"

    function ToolChip({ tool, pos, isHovered, dim, onEnter, onLeave, onPick, mobile }) {
      const [toolTouchRef, toolTouchHover] = useTouchHover();
      useEffect(() => { if (toolTouchHover) onEnter(); else onLeave(); }, [toolTouchHover]);
      const weight = pos.scale || 1;
      const size = (mobile ? 38 : 52) * weight;
      // Bigger/"heavier" tools lift less and respond a touch slower; smaller
      // ones snap up higher and quicker — a rough stand-in for physical weight.
      const liftMagnitude = 11 / weight;
      const lift = isHovered ? -liftMagnitude : 0;
      const duration = (0.2 + weight * 0.09).toFixed(2);
      // The hoverable hit area is a fixed, larger, non-moving zone — only the
      // visual circle inside it lifts/scales. It must stay big enough to
      // fully contain BOTH the resting circle AND the lifted+scaled (1.08x)
      // one, so the tool stays clickable everywhere it's visible — including
      // right where it "jumps" to on hover — not just at its start position.
      // Sized from the actual lift distance + hover scale growth, not a
      // guessed multiplier, so it stays correct if either value changes.
      const hitSize = size * 1.1 + liftMagnitude * 2 + 6;
      return (
        <button
          ref={toolTouchRef}
          className="toolbox-tool"
          onMouseEnter={onEnter}
          onMouseLeave={onLeave}
          onFocus={onEnter}
          onBlur={onLeave}
          onClick={onPick}
          aria-label={`${tool.name} — opne detaljar`}
          style={{
            position: 'absolute', left: `${pos.x}%`, top: `${pos.y}%`,
            width: hitSize, height: hitSize, border: 'none', background: 'transparent',
            padding: 0, cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            transform: `translate(-50%, -50%) rotate(${pos.rot}deg)`,
            opacity: dim ? 0.38 : 1, zIndex: isHovered ? 10 : 1,
            transition: 'opacity 0.25s ease'

            width: size, height: size, border: '2px solid rgba(42,38,32,0.5)', borderRadius: '50%',
            background: '#D8D2C4', display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: size * 0.48, pointerEvents: 'none',
            transform: `translateY(${lift}px) scale(${isHovered ? 1.08 : 1})`,
            boxShadow: isHovered ? '0 10px 18px rgba(0,0,0,0.4)' : '0 4px 10px rgba(0,0,0,0.35)',
            transition: `transform ${duration}s cubic-bezier(.16,1,.3,1), box-shadow 0.25s ease`

            ) : (
              <span aria-hidden="true">{tool.icon}</span>

            <span style={{
              position: 'absolute', bottom: '120%', left: '50%',
              transform: `translateX(-50%) rotate(${-pos.rot}deg)`,
              pointerEvents: 'none'
            }}>
              <span className="toolbox-tooltip" style={{
                display: 'block',
                background: '#2A2620', color: '#fff', padding: '9px 14px', borderRadius: 10,
                fontSize: 12, lineHeight: 1.4, textAlign: 'center',

    function BubbleItem({ b, tweaks, scale, mouseRef, left, top, sz }) {
      const [hov, setHov] = useState(false);
      const [pos, setPos] = useState({ x: 0, y: 0 });
      const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
      const hovRef = useRef(false);
      const elRef = useRef(null);
      const reducedMotion = usePrefersReducedMotion();
      const suppressClickRef = useRef(false);
      const touchRef = useRef({ id: null, startX: 0, startY: 0, startOffX: 0, startOffY: 0, dragging: false });
      const releaseFrameRef = useRef(null);
      useEffect(() => { hovRef.current = hov; }, [hov]);

      useEffect(() => {
        let frame;
        let t = Math.random() * Math.PI * 2;
        const amp = 10 + Math.random() * 8;
        const speed = 0.012 + Math.random() * 0.007;
        const animate = () => {
          t += speed;
          let ix = Math.sin(t) * amp;
          let iy = Math.cos(t * 0.7) * amp;

          // Drift away from the cursor when it gets close — skip while the
          // bubble itself is hovered, so the details stay put to read.
          if (!hovRef.current && elRef.current && mouseRef && mouseRef.current) {
            const rect = elRef.current.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = cx - mouseRef.current.x;
            const dy = cy - mouseRef.current.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const influence = rect.width / 2 + 110;
            if (dist < influence && dist > 0.01) {
              const strength = (1 - dist / influence) * 55;
              ix += (dx / dist) * strength;
              iy += (dy / dist) * strength;
            }
          }

          setPos({ x: ix, y: iy });
          frame = requestAnimationFrame(animate);
        };
        frame = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(frame);
      }, []);

      // Touch "shove": lets fingers drag a bubble aside on devices that have
      // no mouse-driven avoidance. Only touchmove needs a non-passive native
      // listener so preventDefault can stop page scroll once a real drag
      // (not a tap) is detected — a short tap still falls through to the
      // normal onClick below and opens the link as before.
      useEffect(() => {
        const el = elRef.current;
        if (!el) return;
        const handleTouchMove = (ev) => {
          const st = touchRef.current;
          if (st.id == null) return;
          const touch = Array.from(ev.touches).find((tt) => tt.identifier === st.id);
          if (!touch) return;
          const dx = touch.clientX - st.startX;
          const dy = touch.clientY - st.startY;
          if (!st.dragging && Math.hypot(dx, dy) > 8) {
            st.dragging = true;
            setHov(false);
          }
          if (st.dragging) {
            ev.preventDefault();
            const maxReach = 80;
            setDragOffset({
              x: Math.max(-maxReach, Math.min(maxReach, st.startOffX + dx)),
              y: Math.max(-maxReach, Math.min(maxReach, st.startOffY + dy)),
            });
          }
        };
        el.addEventListener('touchmove', handleTouchMove, { passive: false });
        return () => el.removeEventListener('touchmove', handleTouchMove);
      }, []);

      useEffect(() => () => cancelAnimationFrame(releaseFrameRef.current), []);

      const springBack = () => {
        cancelAnimationFrame(releaseFrameRef.current);
        if (reducedMotion) { setDragOffset({ x: 0, y: 0 }); return; }
        const step = () => {
          setDragOffset((prev) => {
            const nx = prev.x * 0.82;
            const ny = prev.y * 0.82;
            if (Math.abs(nx) < 0.4 && Math.abs(ny) < 0.4) return { x: 0, y: 0 };
            releaseFrameRef.current = requestAnimationFrame(step);
            return { x: nx, y: ny };
          });
        };
        releaseFrameRef.current = requestAnimationFrame(step);
      };

      const handleTouchStart = (ev) => {
        if (ev.touches.length !== 1) return;
        const touch = ev.touches[0];
        cancelAnimationFrame(releaseFrameRef.current);
        touchRef.current = {
          id: touch.identifier,
          startX: touch.clientX,
          startY: touch.clientY,
          startOffX: dragOffset.x,
          startOffY: dragOffset.y,
          dragging: false,
        };
      };

      const endTouch = () => {
        const st = touchRef.current;
        if (st.id != null && st.dragging) {
          suppressClickRef.current = true;
          springBack();
        }
        touchRef.current = { id: null, startX: 0, startY: 0, startOffX: 0, startOffY: 0, dragging: false };
      };

      return (
        <div
          ref={elRef}
          onTouchStart={handleTouchStart}
          onTouchEnd={endTouch}
          onTouchCancel={endTouch}
          style={{
            position: 'absolute',
            left,
            top,
            width: sz,
            height: sz,
            transform: `translate(${pos.x + dragOffset.x}px, ${pos.y + dragOffset.y}px)`,

    function VolunteerBubbles({ tweaks, bp }) {
      const w = bp ? bp.width : 1100;
      const mobile = bp && bp.isMobile;
      // Below 400px the desktop formula used to stay flat at 1 — the vast
      // majority of phones (375–430px) got zero size relief. Ease down
      // continuously instead, steepening as the screen narrows, with a
      // 0.5 floor so text never becomes illegible. Matches the desktop
      // branch exactly at w=400 so there's no visible seam.
      const shrink = Math.min(1, Math.max(0, (400 - w) / 80));
      const scale = w <= 400
        ? 1 - 0.5 * Math.pow(shrink, 0.3)
        : Math.min(1.15, 1 + (w - 400) / 2400);
      const mouseRef = useRef({ x: -9999, y: -9999 });
      useEffect(() => {
        const move = (e) => { mouseRef.current = { x: e.clientX, y: e.clientY }; };
        window.addEventListener('mousemove', move);
        return () => window.removeEventListener('mousemove', move);
      }, []);

      if (mobile) {
        // The desktop x/y canvas was designed for a ~1100px-wide stage and
        // gets cramped on a ~300px-wide phone. Stack the bubbles instead,
        // in reading order, with a gentle left/right stagger so it still
        // reads as "floating" rather than a strict grid — but each bubble
        // gets its own vertical band so nothing overlaps or crowds.
        const containerWidthPx = Math.max(200, w - 48);
        const gap = 26;
        const xPattern = [0.04, 0.32, 0.02, 0.28, 0.08];
        let cursorTop = 6;
        const laidOut = bubbleData.map((b, i) => {
          const sz = Math.round(b.size * scale);
          const maxLeftFrac = Math.max(0, (containerWidthPx - sz) / containerWidthPx);
          const leftFrac = Math.min(xPattern[i % xPattern.length], maxLeftFrac);
          const left = Math.round(leftFrac * containerWidthPx);
          const top = cursorTop;
          cursorTop += sz + gap;
          return { b, sz, left, top };
        });
        const containerH = Math.round(cursorTop - gap + 20);
        return (
          <div className="reveal" style={{ position: 'relative', height: containerH, width: '100%' }}>
            {laidOut.map(({ b, sz, left, top }, i) => (
              <BubbleItem
                key={i} b={b} tweaks={tweaks} scale={scale} mouseRef={mouseRef}
                left={`${left}px`} top={`${top}px`} sz={sz}
              />
            ))}
          </div>
        );
      }

      // Container height covers the lowest bubble's bottom edge, whatever the scale.
      const containerH = Math.round(Math.max(
        280 * scale,
        ...bubbleData.map(b => (b.y / 100) * 280 * scale + b.size * scale)
      ) + 24);
      return (
        <div className="reveal" style={{ position: 'relative', height: containerH, width: '100%' }}>
          {bubbleData.map((b, i) => (
            <BubbleItem
              key={i} b={b} tweaks={tweaks} scale={scale} mouseRef={mouseRef}
              left={`${b.x}%`} top={`${b.y}%`} sz={Math.round(b.size * scale)}
            />
          ))}
        </div>
      );
    }
