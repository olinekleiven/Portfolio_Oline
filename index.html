<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oline Flatabø Kleiven — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #EDE0CF; color: #2A2620; font-family: 'DM Sans', sans-serif; overflow-x: hidden; }

    /* Custom pointer: a plain, neutral white dot that follows the mouse (see
       Cursor() in the script below). Native cursor is hidden everywhere;
       positioning is done with an un-transitioned transform so it tracks the
       mouse with zero lag — only the dot's own size/scale transitions. */
    * { cursor: none !important; }
    #pointer { position: fixed; top: 0; left: 0; width: 0; height: 0; pointer-events: none; z-index: 9999; }
    #pointer-dot {
      position: absolute; left: 0; top: 0;
      width: 16px; height: 16px; margin: -8px 0 0 -8px;
      border-radius: 50%; background: #fff;
      box-shadow: 0 2px 8px rgba(36,31,25,0.35);
      transition: width 0.25s cubic-bezier(.16,1,.3,1), height 0.25s cubic-bezier(.16,1,.3,1),
                  margin 0.25s cubic-bezier(.16,1,.3,1), background 0.25s ease,
                  box-shadow 0.25s ease, transform 0.15s ease, opacity 0.25s cubic-bezier(.16,1,.3,1);
    }
    #pointer.active #pointer-dot {
      width: 38px; height: 38px; margin: -19px 0 0 -19px;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 6px 18px rgba(36,31,25,0.3);
    }
    #pointer.click #pointer-dot { transform: scale(0.75); }
    /* Key cursor — shown while the Skills/toolbox section is in view and the
       toolbox is still closed (see Cursor() + useToolboxOpenGlobal below).
       Crossfades with the regular dot rather than replacing it abruptly. */
    #pointer-key {
      position: absolute; left: 0; top: 0;
      font-size: 46px; line-height: 1;
      transform: translate(-50%,-50%) scale(0.4) rotate(-25deg);
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(.16,1,.3,1), transform 0.25s cubic-bezier(.16,1,.3,1);
      pointer-events: none;
      user-select: none;
    }
    #pointer.key #pointer-dot { opacity: 0; transform: scale(0.3); }
    #pointer.key #pointer-key { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(-25deg); }
    /* Key-turn sequence — plays on the cursor's own key emoji, frozen over the
       toolbox latch (see Cursor()'s unlock effects + ToolboxClosed's
       handleOpen), so the cursor itself visually "does" the unlocking rather
       than the latch graphic animating on its own. Duration matches
       TOOLBOX_UNLOCK_MS (420ms) so it reads as one continuous motion with the
       toolboxLatchTurn/toolboxLatchSlide animations on the box itself. The
       transition above is overridden by this animation while '.unlocking' is
       present; '.key' stays applied throughout so the emoji (not the dot)
       stays visible. */
    @keyframes pointerKeyTurn {
      0%   { transform: translate(-50%,-50%) rotate(-25deg) scale(1); }
      35%  { transform: translate(-50%,-50%) rotate(15deg) scale(1.12); }
      70%  { transform: translate(-50%,-50%) rotate(60deg) scale(1.18); }
      100% { transform: translate(-50%,-50%) rotate(60deg) scale(1.15); }
    }
    #pointer.unlocking #pointer-key {
      animation: pointerKeyTurn 0.42s cubic-bezier(.4,0,.2,1) forwards;
    }
    @media (hover: none) {
      #pointer { display: none !important; }
      * { cursor: auto !important; }
    }

    /* Scroll reveal */
    .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s cubic-bezier(.16,1,.3,1), transform 0.8s cubic-bezier(.16,1,.3,1); }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-left { opacity: 0; transform: translateX(-40px); transition: opacity 0.9s cubic-bezier(.16,1,.3,1), transform 0.9s cubic-bezier(.16,1,.3,1); }
    .reveal-left.visible { opacity: 1; transform: translateX(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.35s; }
    .reveal-delay-4 { transition-delay: 0.5s; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #EDE0CF; }
    ::-webkit-scrollbar-thumb { background: #C04B22; border-radius: 2px; }

    /* Tweaks panel */
    #tweaks-panel { position: fixed; bottom: 24px; right: 24px; background: #2A2620; color: #EDE0CF; padding: 20px; border-radius: 12px; width: 240px; z-index: 9000; font-family: 'DM Sans', sans-serif; font-size: 13px; display: none; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    #tweaks-panel.open { display: block; }
    #tweaks-panel h4 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.5; margin-bottom: 16px; }
    .tweak-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .tweak-row label { opacity: 0.8; }
    .tweak-row input[type=color] { width: 28px; height: 28px; border: none; border-radius: 50%; cursor: pointer !important; background: none; padding: 0; }
    .tweak-row input[type=range] { width: 100px; accent-color: #C04B22; cursor: pointer !important; }
    .tweak-row select { background: #3A352F; color: #EDE0CF; border: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer !important; }

    /* Marquee */
    .marquee-track { display: flex; animation: marquee 28s linear infinite; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* Paper plane send animation. The trail (paperTrailReveal / paperTrailFade)
       reuses these exact same keyframe checkpoints so the two curves are
       mathematically identical in shape — the trail is given a small
       animation-delay in JS instead of different keyframe stops, so it always
       trails the plane by a fixed, precise amount rather than drifting. */
    @keyframes paperPlaneFly {
      0% { opacity: 0; offset-distance: 0%; }
      6% { opacity: 1; }
      70% { opacity: 1; offset-distance: 100%; }
      100% { opacity: 0; offset-distance: 100%; }
    }
    @keyframes paperTrailReveal {
      0% { stroke-dashoffset: 100; }
      70% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes paperTrailFade {
      0% { opacity: 0; }
      6% { opacity: 0.55; }
      70% { opacity: 0.55; }
      100% { opacity: 0; }
    }

    /* Toolbox — idle wobble on the closed box, to hint it's interactive */
    @keyframes toolboxWobble {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      20% { transform: rotate(-1.4deg) translateY(-2px); }
      50% { transform: rotate(1deg) translateY(0); }
      75% { transform: rotate(-0.6deg) translateY(-1px); }
    }
    .toolbox-wobble { animation: toolboxWobble 4.5s ease-in-out infinite; }
    .toolbox-wobble:hover, .toolbox-wobble:focus-visible { animation-play-state: paused; }

    /* Toolbox — the OPEN box's handle doubles as its close button; a soft
       resting glow (see ToolboxHandleArch) is the only hint it needs. */
    .toolbox-handle-btn:focus-visible {
      outline: 3px solid #fff; outline-offset: 4px; border-radius: 12px;
    }

    /* Toolbox — key-unlock sequence played on click, before the box swaps to
       its open state. The latch (keyhole plate) turns as if a key is
       twisting it, then the whole plate slides down and fades as the
       shackle "gives". Only ever applied when NOT reduced-motion — see
       ToolboxClosed's handleOpen, which skips this entirely otherwise. */
    @keyframes toolboxLatchTurn {
      0% { transform: translate(-50%,-50%) rotate(0deg); }
      55% { transform: translate(-50%,-50%) rotate(95deg); }
      100% { transform: translate(-50%,-50%) rotate(95deg); }
    }
    @keyframes toolboxLatchSlide {
      0%, 25% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
      70% { transform: translateX(-50%) translateY(8px) scale(0.85); opacity: 1; }
      100% { transform: translateX(-50%) translateY(14px) scale(0.6); opacity: 0; }
    }
    .toolbox-unlocking .toolbox-latch-hole { animation: toolboxLatchTurn 0.42s ease forwards; }
    .toolbox-unlocking .toolbox-latch { animation: toolboxLatchSlide 0.42s cubic-bezier(.4,0,.2,1) forwards; }
    .toolbox-tool:focus-visible, .toolbox-box:focus-visible {
      outline: 3px solid #fff; outline-offset: 3px;
    }
    /* .toolbox-close sits on light backgrounds (section bg / detail card), so a
       white outline is invisible there — use a dark outline instead. */
    .toolbox-close:focus-visible {
      outline: 3px solid #2A2620; outline-offset: 3px;
    }
    /* Carousel arrows sit on a dark photo-overlay gradient, so a white
       outline reads clearly there. */
    .carousel-arrow:focus-visible {
      outline: 2px solid #fff; outline-offset: 2px;
    }
    @keyframes toolboxTooltipIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .toolbox-tooltip { animation: toolboxTooltipIn 0.16s cubic-bezier(.16,1,.3,1); }
    @media (prefers-reduced-motion: reduce) {
      .toolbox-wobble { animation: none; }
      .toolbox-box, .toolbox-tool, .toolbox-lid, .toolbox-panel, .toolbox-open-reveal { transition-duration: 0.01ms !important; }
      .toolbox-tooltip { animation-duration: 0.01ms !important; }
      .toolbox-latch, .toolbox-latch-hole { animation-duration: 0.01ms !important; }
      #pointer-key { animation-duration: 0.01ms !important; }
    }
    /* The diploma link is only shown via onMouseEnter/onMouseLeave hover state,
       which never fires on touch devices — so it would otherwise be permanently
       invisible and unclickable there. On true touch devices (no fine pointer
       to hover with) always show it, dimmed, instead of relying on hover. */
    @media (hover: none), (pointer: coarse) {
      .diploma-link {
        opacity: 0.75 !important;
        pointer-events: auto !important;
        color: var(--accent) !important;
      }
    }
  </style>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg">
      <rect width="80" height="56" fill="#f3e9dd"/>
      <circle cx="40" cy="22" r="10" fill="#C04B22" opacity="0.3"/>
      <rect x="16" y="36" width="48" height="3" rx="1.5" fill="#2A2620" opacity="0.2"/>
      <rect x="24" y="42" width="32" height="2" rx="1" fill="#C04B22" opacity="0.4"/>
    </svg>
  </template>
</head>
<body>
  <div id="pointer" aria-hidden="true">
    <div id="pointer-dot"></div>
    <div id="pointer-key">🔑</div>
  </div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#b95d3c",
      "bg": "#f5ead8",
      "dark": "#2A2620",
      "fontHeading": "Playfair Display",
      "spacing": 1.1
    }/*EDITMODE-END*/;


    // Text scramble hook
    const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    function useScramble(text, delay = 400) {
      const [display, setDisplay] = useState(text);
      useEffect(() => {
        let frame = 0, iter = 0;
        const timeout = setTimeout(() => {
          const interval = setInterval(() => {
            setDisplay(text.split('').map((ch, i) => {
              if (ch === ' ') return ' ';
              if (i < iter) return text[i];
              return CHARS[Math.floor(Math.random() * CHARS.length)];
            }).join(''));
            iter += 0.4;
            if (iter >= text.length) clearInterval(interval);
          }, 40);
        }, delay);
        return () => clearTimeout(timeout);
      }, [text]);
      return display;
    }

    // Magnetic button wrapper
    function MagBtn({ children, style, ...props }) {
      const ref = useRef(null);
      const handleMove = (e) => {
        const r = ref.current.getBoundingClientRect();
        const x = (e.clientX - r.left - r.width / 2) * 0.25;
        const y = (e.clientY - r.top - r.height / 2) * 0.25;
        ref.current.style.transform = `translate(${x}px, ${y}px)`;
      };
      const handleLeave = () => { ref.current.style.transform = 'translate(0,0)'; };
      return (
        <span ref={ref} className="mag-btn" onMouseMove={handleMove} onMouseLeave={handleLeave} style={{ display: 'inline-block', ...style }}>
          {React.cloneElement(children, props)}
        </span>
      );
    }

    // Skills marquee ticker
    const tickerItems = ['Figma', '✦', 'React', '✦', 'Brukertesting', '✦', 'Prototyping', '✦', 'Interaction Design', '✦', 'HTML / CSS / JS', '✦', 'Python', '✦', 'UX Research', '✦', 'Wireframing', '✦', 'mySQL', '✦'];

    function Ticker({ tweaks }) {
      const items = [...tickerItems, ...tickerItems];
      return (
        <div style={{ overflow: 'hidden', background: tweaks.accent, padding: '14px 0', borderTop: `1px solid ${tweaks.accent}`, borderBottom: `1px solid ${tweaks.accent}` }}>
          <div className="marquee-track">
            {items.map((item, i) => (
              <span key={i} style={{ color: '#fff', fontSize: 13, fontWeight: 500, letterSpacing: '0.08em', textTransform: 'uppercase', paddingRight: 32, whiteSpace: 'nowrap', opacity: item === '✦' ? 0.5 : 1 }}>{item}</span>
            ))}
          </div>
        </div>
      );
    }

    // Custom pointer: moves the #pointer element 1:1 with the mouse (no
    // lerp/transition on position — that's what caused the old cursor to
    // visibly lag), and toggles the spark/click states via CSS classes.
    function Cursor() {
      const [skillsInView, setSkillsInView] = useState(false);
      const toolboxOpen = useToolboxOpenGlobal();
      const unlock = useToolboxUnlockGlobal();
      const showKey = skillsInView && !toolboxOpen;
      const unlockActiveRef = useRef(false);
      useEffect(() => { unlockActiveRef.current = unlock.active; }, [unlock.active]);

      useEffect(() => {
        const pointer = document.getElementById('pointer');
        const move = (e) => {
          // While the key-unlock sequence is playing, the cursor is frozen
          // over the latch (see the effect below) — ignore real mouse moves
          // so the key doesn't drift away from the lock mid-turn.
          if (unlockActiveRef.current) return;
          pointer.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
        };
        const over = () => pointer.classList.add('active');
        const out = () => pointer.classList.remove('active');
        let clickTimer;
        const down = () => {
          pointer.classList.add('click');
          clearTimeout(clickTimer);
          clickTimer = setTimeout(() => pointer.classList.remove('click'), 150);
        };
        document.addEventListener('mousemove', move);
        document.addEventListener('mousedown', down);
        document.querySelectorAll('a, button, [role="link"]').forEach(el => {
          el.addEventListener('mouseenter', over);
          el.addEventListener('mouseleave', out);
        });
        return () => {
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mousedown', down);
          clearTimeout(clickTimer);
        };
      }, []);

      // Swap to a key cursor while the Skills/toolbox section is in view and
      // the box is still locked — a hint that the box can be "unlocked".
      // Goes away the instant the box opens (or the section scrolls out).
      useEffect(() => {
        const skills = document.getElementById('skills');
        if (!skills) return;
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => setSkillsInView(e.isIntersecting));
        }, { threshold: 0.25 });
        obs.observe(skills);
        return () => obs.disconnect();
      }, []);

      useEffect(() => {
        const pointer = document.getElementById('pointer');
        if (!pointer) return;
        pointer.classList.toggle('key', showKey);
      }, [showKey]);

      // Freeze the cursor over the latch and play the key-turn animation
      // while unlocking is active; let it resume following the mouse (via a
      // plain class removal — the next real mousemove naturally snaps it
      // back) once the sequence finishes.
      useEffect(() => {
        const pointer = document.getElementById('pointer');
        if (!pointer) return;
        if (unlock.active) {
          pointer.style.transform = `translate3d(${unlock.x}px, ${unlock.y}px, 0)`;
          pointer.classList.add('unlocking');
        } else {
          pointer.classList.remove('unlocking');
        }
      }, [unlock.active, unlock.x, unlock.y]);

      return null;
    }

    // Touch-hover manager
    //
    // Native touch events only ever fire on the element a gesture *started*
    // on — a finger that scrolls/drags across other hover-styled elements
    // never triggers enter/leave there the way a mouse does. That means all
    // our onMouseEnter/onMouseLeave hover styling is invisible on touch
    // devices until the user commits to a tap on that exact element.
    //
    // To fix that, we track the finger's position globally (one listener on
    // window, throttled to one elementFromPoint() lookup per animation
    // frame so fast scrolling never gets janky) and look up which registered
    // hover-target it's currently over, toggling that target's hover state
    // explicitly — reconstructing mouseenter/mouseleave semantics for touch.
    // Purely additive: real mouse hover behaviour is completely untouched,
    // since this only ever reacts to touchstart/touchmove/touchend/touchcancel.
    const touchHoverRegistry = new Set();
    let touchHoverActive = null;
    let touchHoverRaf = null;

    function resolveTouchHoverTarget(x, y) {
      const el = document.elementFromPoint(x, y);
      let matched = null;
      for (const entry of touchHoverRegistry) {
        const node = entry.ref.current;
        if (node && el && (node === el || node.contains(el))) { matched = entry; break; }
      }
      if (matched !== touchHoverActive) {
        if (touchHoverActive) touchHoverActive.setActive(false);
        if (matched) matched.setActive(true);
        touchHoverActive = matched;
      }
    }

    function queueTouchHoverUpdate(x, y) {
      if (touchHoverRaf) cancelAnimationFrame(touchHoverRaf);
      touchHoverRaf = requestAnimationFrame(() => { touchHoverRaf = null; resolveTouchHoverTarget(x, y); });
    }

    function clearTouchHover() {
      if (touchHoverRaf) { cancelAnimationFrame(touchHoverRaf); touchHoverRaf = null; }
      if (touchHoverActive) { touchHoverActive.setActive(false); touchHoverActive = null; }
    }

    window.addEventListener('touchstart', e => { const t = e.touches[0]; if (t) queueTouchHoverUpdate(t.clientX, t.clientY); }, { passive: true });
    window.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) queueTouchHoverUpdate(t.clientX, t.clientY); }, { passive: true });
    window.addEventListener('touchend', clearTouchHover, { passive: true });
    window.addEventListener('touchcancel', clearTouchHover, { passive: true });

    // Register a DOM node (via the returned ref) as a touch-hover target.
    // Returns [ref, active] — active mirrors what onMouseEnter/onMouseLeave
    // would have been doing, but driven by the global touch tracker above.
    function useTouchHover() {
      const ref = useRef(null);
      const [active, setActive] = useState(false);
      useEffect(() => {
        const entry = { ref, setActive };
        touchHoverRegistry.add(entry);
        return () => {
          touchHoverRegistry.delete(entry);
          if (touchHoverActive === entry) touchHoverActive = null;
        };
      }, []);
      return [ref, active];
    }

    // Convenience wrapper for the many spots that mutate the DOM node
    // directly in onMouseEnter/onMouseLeave (rather than via React state):
    // replays the exact same handlers when touch-hover turns on/off, via a
    // minimal fake event ({ currentTarget, target }) so no handler logic
    // needs to be duplicated. Returns a ref to attach to the target node.
    function useTouchHoverStyle(onEnter, onLeave) {
      const [ref, active] = useTouchHover();
      useEffect(() => {
        const node = ref.current;
        if (!node) return;
        const fakeEvent = { currentTarget: node, target: node };
        if (active) onEnter(fakeEvent); else onLeave(fakeEvent);
      }, [active]);
      return ref;
    }

    // Toolbox-open global state
    //
    // Cursor() and Skills() are unrelated components with no shared props —
    // this is a tiny pub-sub, parallel to (but independent of)
    // touchHoverRegistry above, that lets Skills broadcast whether the
    // toolbox is open so Cursor can react (swap to the key cursor) without
    // any prop drilling.
    let toolboxOpenState = false;
    const toolboxOpenListeners = new Set();
    function setToolboxOpenGlobal(v) {
      toolboxOpenState = v;
      toolboxOpenListeners.forEach(fn => fn(v));
    }
    function useToolboxOpenGlobal() {
      const [v, setV] = useState(toolboxOpenState);
      useEffect(() => {
        toolboxOpenListeners.add(setV);
        return () => toolboxOpenListeners.delete(setV);
      }, []);
      return v;
    }

    // Same pub-sub pattern again, this time for the key-unlock sequence: lets
    // ToolboxClosed broadcast the on-screen position of the latch (and
    // whether the unlock animation is currently playing) so Cursor can freeze
    // the key cursor there and play the turning animation on it — making the
    // cursor itself look like it's doing the unlocking, instead of two
    // unrelated animations happening in parallel. Independent of
    // toolboxOpenState/toolboxOpenListeners above.
    let toolboxUnlockPos = { active: false, x: 0, y: 0 };
    const toolboxUnlockListeners = new Set();
    function setToolboxUnlockGlobal(v) {
      toolboxUnlockPos = v;
      toolboxUnlockListeners.forEach(fn => fn(v));
    }
    function useToolboxUnlockGlobal() {
      const [v, setV] = useState(toolboxUnlockPos);
      useEffect(() => {
        toolboxUnlockListeners.add(setV);
        return () => toolboxUnlockListeners.delete(setV);
      }, []);
      return v;
    }

    // Breakpoint hook
    function useBreakpoint() {
      const [width, setWidth] = useState(window.innerWidth);
      useEffect(() => {
        const h = () => setWidth(window.innerWidth);
        window.addEventListener('resize', h);
        return () => window.removeEventListener('resize', h);
      }, []);
      return { isMobile: width < 640, isTablet: width < 1024, width };
    }

    // Scroll reveal hook
    function useReveal() {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal, .reveal-left');
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      });
    }

    // Nav
    const NAV_SECTIONS = ['hero', 'om-meg', 'utdanning', 'prosjekter', 'erfaring', 'skills', 'verv', 'kontakt'];
    const NAV_DARK_SECTIONS = new Set(['utdanning', 'prosjekter', 'kontakt']);
    function Nav({ tweaks, bp }) {
      const [scrolled, setScrolled] = useState(false);
      const [activeSection, setActiveSection] = useState('hero');
      const [menuOpen, setMenuOpen] = useState(false);

      const heroCvTouchRef = useTouchHoverStyle(heroCvEnter, heroCvLeave);

      // Parallax on the portrait, driven directly on the DOM node (no React
      // re-render per scroll event) and batched to one update per animation
      // frame so it stays smooth even with many other scroll/reveal listeners
      // on the page. Purely decorative, so it's skipped entirely when the
      // user prefers reduced motion.
      React.useEffect(() => {
        if (reducedMotion || bp.isMobile) return;
        let rafId = null;
        const applyParallax = () => {
          rafId = null;

          if (el) el.style.transform = `translateY(calc(-50% + ${window.scrollY * 0.12}px))`;
        };
        const onScroll = () => {
          if (rafId === null) rafId = window.requestAnimationFrame(applyParallax);
        };
        applyParallax();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => {
          window.removeEventListener('scroll', onScroll);

        };

      const [hov, setHov] = useState(false);
      const [pressed, setPressed] = useState(false);
      const [touchRef, touchHover] = useTouchHover();
      useEffect(() => { setHov(touchHover); }, [touchHover]);
      const scale = pressed ? 0.86 : hov ? 1.1 : 1;
      return (
        <button
          ref={touchRef}
          className="carousel-arrow"
          onClick={() => onGo(dir)}
          aria-label={label}
          onMouseEnter={() => setHov(true)}
          onMouseLeave={() => { setHov(false); setPressed(false); }}
          onMouseDown={() => setPressed(true)}
          onMouseUp={() => setPressed(false)}
          onTouchStart={() => setPressed(true)}
          onTouchEnd={() => setPressed(false)}
          style={{
            width: 34, height: 34, borderRadius: '50%', border: 'none', cursor: 'pointer',
            background: hov || pressed ? 'rgba(255,255,255,0.32)' : 'rgba(255,255,255,0.18)',

    // Left-side portrait, now a small photo browser — starts on the plain
    // portrait, then flips through every photo Oline supplied (GALLERY),
    // one at a time, via the overlay controls baked into the image itself.
    function PhotoCarousel({ tweaks, bp }) {
      const reducedMotion = usePrefersReducedMotion();
      const cards = GALLERY;
      const idxRef = useRef(0);
      const [dispIdx, setDispIdx] = useState(0);
      const [visible, setVisible] = useState(true);

      const go = dir => {
        const next = (idxRef.current + dir + cards.length) % cards.length;
        if (reducedMotion) { idxRef.current = next; setDispIdx(next); return; }
        setVisible(false);
        window.setTimeout(() => {
          idxRef.current = next;
          setDispIdx(next);
          requestAnimationFrame(() => setVisible(true));
        }, 110);
      };

      const card = cards[dispIdx];
      const size = bp.isMobile ? 'clamp(220px, 70vw, 320px)' : 320;

      return (
        <div className="reveal" style={{ marginBottom: 24 }}>
          <div
            role="group"
            aria-label={`Biletgalleri, bilete ${dispIdx + 1} av ${cards.length}`}
            style={{

              borderRadius: 20, overflow: 'hidden', border: `3px solid ${tweaks.accent}60`,
              background: `${tweaks.dark}08`

            }}>

                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </CarouselArrow>

                fontSize: 12, color: '#fff', textAlign: 'center',

    function usePrefersReducedMotion() {
      const [reduced, setReduced] = useState(false);
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        setReduced(mq.matches);
        const handler = (e) => setReduced(e.matches);
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, []);
      return reduced;
    }

    // The handle is purely decorative on the closed box (the whole box is
    // already the open-trigger), but on the OPEN box it doubles as the close
    // control — pass onClose to make it a real, obviously-pressable button
    // instead of a floating ✕ elsewhere on the card.
    function ToolboxHandleArch({ width, height, borderWidth, color, onClose }) {
      const [hov, setHov] = useState(false);
      const [handleTouchRef, handleTouchHover] = useTouchHover();
      useEffect(() => { if (onClose) setHov(handleTouchHover); }, [handleTouchHover, onClose]);

      // A gentle lift, not a full colour swap to the accent — just enough to
      // read as "this responds to you", same size and shape either way.
      const archColor = onClose && hov ? '#5C4128' : color;
      const sharedStyle = {
        position: 'absolute', top: 0, left: '50%', transform: 'translateX(-50%)',
        width, height, border: `${borderWidth}px solid ${archColor}`, borderBottom: 'none',
        borderRadius: '50% 50% 0 0',
      };

      if (!onClose) {
        return <div aria-hidden="true" style={{ ...sharedStyle, zIndex: 0, pointerEvents: 'none' }} />;
      }

      // Looks exactly like the plain decorative arch (same size, same z-index
      // — tucked behind the box, nothing added in front of the tools) with
      // only the border colour shifting a touch on hover/touch as the hint
      // that it's pressable. No filter/glow — Safari renders a filtered
      // <button> with its opaque default background instead of the intended
      // transparent one, which is what produced the black block before.
      return (
        <button
          ref={handleTouchRef}
          onClick={onClose}
          onMouseEnter={() => setHov(true)}
          onMouseLeave={() => setHov(false)}
          aria-label="Lukk verktøykassa"
          className="toolbox-handle-btn"
          style={{
            ...sharedStyle, zIndex: 0, background: 'transparent', padding: 0, margin: 0,
            cursor: 'pointer', WebkitAppearance: 'none', appearance: 'none',
            transition: 'border-color 0.25s ease'
          }}
        />
      );
    }

    // Duration of the key-unlock sequence (latch turn + slide) — kept in one
    // place so the CSS animation lengths (toolboxLatchTurn/toolboxLatchSlide,
    // both 0.42s) and the JS delay before actually swapping to the open
    // stage always stay in sync.

    function ToolboxClosed({ onOpen, mobile, reducedMotion, tweaks }) {
      const [hov, setHov] = useState(false);
      const [unlocking, setUnlocking] = useState(false);
      const [boxTouchRef, boxTouchHover] = useTouchHover();
      const latchRef = useRef(null);
      useEffect(() => { setHov(boxTouchHover); }, [boxTouchHover]);
      const boxH = mobile ? 150 : 260;

      // Works identically whether triggered by a click or by keyboard
      // (Enter/Space) activation of the button — getBoundingClientRect() on
      // the latch reads its current on-screen position either way, so the
      // event itself is never needed as a position source.
      const handleOpen = () => {
        if (unlocking) return; // already mid-sequence — ignore repeat activation
        if (reducedMotion) { onOpen(); return; }
        if (latchRef.current) {
          const r = latchRef.current.getBoundingClientRect();
          setToolboxUnlockGlobal({ active: true, x: r.left + r.width / 2, y: r.top + r.height / 2 });
        }
        setUnlocking(true);
        setTimeout(() => {
          setToolboxUnlockGlobal({ active: false, x: 0, y: 0 });
          onOpen();
        }, TOOLBOX_UNLOCK_MS);
      };

      return (
        <div style={{ width: '100%', maxWidth: mobile ? 400 : 900, margin: '0 auto', textAlign: 'center' }}>

    function ToolChip({ tool, pos, isHovered, dim, onEnter, onLeave, onPick, mobile }) {
      const [toolTouchRef, toolTouchHover] = useTouchHover();
      useEffect(() => { if (toolTouchHover) onEnter(); else onLeave(); }, [toolTouchHover]);
      const weight = pos.scale || 1;
      const size = (mobile ? 38 : 52) * weight;
      // Bigger/"heavier" tools lift less and respond a touch slower; smaller
      // ones snap up higher and quicker — a rough stand-in for physical weight.
      const liftMagnitude = 11 / weight;
      const lift = isHovered ? -liftMagnitude : 0;
      const duration = (0.2 + weight * 0.09).toFixed(2);
      // The hoverable hit area is a fixed, larger, non-moving zone — only the
      // visual circle inside it lifts/scales. It must stay big enough to
      // fully contain BOTH the resting circle AND the lifted+scaled (1.08x)
      // one, so the tool stays clickable everywhere it's visible — including
      // right where it "jumps" to on hover — not just at its start position.
      // Sized from the actual lift distance + hover scale growth, not a
      // guessed multiplier, so it stays correct if either value changes.
      const hitSize = size * 1.1 + liftMagnitude * 2 + 6;
      return (
        <button
          ref={toolTouchRef}
          className="toolbox-tool"
          onMouseEnter={onEnter}
          onMouseLeave={onLeave}
          onFocus={onEnter}
          onBlur={onLeave}
          onClick={onPick}
          aria-label={`${tool.name} — opne detaljar`}
          style={{

            display: 'flex', alignItems: 'center', justifyContent: 'center',
            transform: `translate(-50%, -50%) rotate(${pos.rot}deg)`,

            fontSize: size * 0.48, pointerEvents: 'none',

    function BubbleItem({ b, tweaks, scale, mouseRef, left, top, sz }) {
      const [hov, setHov] = useState(false);
      const [pos, setPos] = useState({ x: 0, y: 0 });
      const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
      const hovRef = useRef(false);
      const elRef = useRef(null);
      const reducedMotion = usePrefersReducedMotion();
      const suppressClickRef = useRef(false);
      const touchRef = useRef({ id: null, startX: 0, startY: 0, startOffX: 0, startOffY: 0, dragging: false });
      const releaseFrameRef = useRef(null);
      useEffect(() => { hovRef.current = hov; }, [hov]);

      useEffect(() => {
        let frame;
        let t = Math.random() * Math.PI * 2;
        const amp = 10 + Math.random() * 8;
        const speed = 0.012 + Math.random() * 0.007;
        const animate = () => {
          t += speed;
          let ix = Math.sin(t) * amp;
          let iy = Math.cos(t * 0.7) * amp;

          // Drift away from the cursor when it gets close — skip while the
          // bubble itself is hovered, so the details stay put to read.
          if (!hovRef.current && elRef.current && mouseRef && mouseRef.current) {
            const rect = elRef.current.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = cx - mouseRef.current.x;
            const dy = cy - mouseRef.current.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const influence = rect.width / 2 + 110;
            if (dist < influence && dist > 0.01) {
              const strength = (1 - dist / influence) * 55;
              ix += (dx / dist) * strength;
              iy += (dy / dist) * strength;
            }
          }

          setPos({ x: ix, y: iy });
          frame = requestAnimationFrame(animate);
        };
        frame = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(frame);
      }, []);

      // Touch "shove": lets fingers drag a bubble aside on devices that have
      // no mouse-driven avoidance. Only touchmove needs a non-passive native
      // listener so preventDefault can stop page scroll once a real drag
      // (not a tap) is detected — a short tap still falls through to the
      // normal onClick below and opens the link as before.
      useEffect(() => {
        const el = elRef.current;
        if (!el) return;
        const handleTouchMove = (ev) => {
          const st = touchRef.current;
          if (st.id == null) return;
          const touch = Array.from(ev.touches).find((tt) => tt.identifier === st.id);
          if (!touch) return;
          const dx = touch.clientX - st.startX;
          const dy = touch.clientY - st.startY;
          if (!st.dragging && Math.hypot(dx, dy) > 8) {
            st.dragging = true;
            setHov(false);
          }
          if (st.dragging) {
            ev.preventDefault();
            const maxReach = 80;
            setDragOffset({
              x: Math.max(-maxReach, Math.min(maxReach, st.startOffX + dx)),
              y: Math.max(-maxReach, Math.min(maxReach, st.startOffY + dy)),
            });
          }
        };
        el.addEventListener('touchmove', handleTouchMove, { passive: false });
        return () => el.removeEventListener('touchmove', handleTouchMove);
      }, []);

      useEffect(() => () => cancelAnimationFrame(releaseFrameRef.current), []);

      const springBack = () => {
        cancelAnimationFrame(releaseFrameRef.current);
        if (reducedMotion) { setDragOffset({ x: 0, y: 0 }); return; }
        const step = () => {
          setDragOffset((prev) => {
            const nx = prev.x * 0.82;
            const ny = prev.y * 0.82;
            if (Math.abs(nx) < 0.4 && Math.abs(ny) < 0.4) return { x: 0, y: 0 };
            releaseFrameRef.current = requestAnimationFrame(step);
            return { x: nx, y: ny };
          });
        };
        releaseFrameRef.current = requestAnimationFrame(step);
      };

      const handleTouchStart = (ev) => {
        if (ev.touches.length !== 1) return;
        const touch = ev.touches[0];
        cancelAnimationFrame(releaseFrameRef.current);
        touchRef.current = {
          id: touch.identifier,
          startX: touch.clientX,
          startY: touch.clientY,
          startOffX: dragOffset.x,
          startOffY: dragOffset.y,
          dragging: false,
        };
      };

      const endTouch = () => {
        const st = touchRef.current;
        if (st.id != null && st.dragging) {
          suppressClickRef.current = true;
          springBack();
        }
        touchRef.current = { id: null, startX: 0, startY: 0, startOffX: 0, startOffY: 0, dragging: false };
      };

      return (
        <div
          ref={elRef}
          onTouchStart={handleTouchStart}
          onTouchEnd={endTouch}
          onTouchCancel={endTouch}
          style={{
            position: 'absolute',
            left,
            top,
            width: sz,
            height: sz,
            transform: `translate(${pos.x + dragOffset.x}px, ${pos.y + dragOffset.y}px)`,
            zIndex: hov ? 2 : 1,
            touchAction: 'none',
          }}
        >
          <div
            role={b.url ? 'link' : undefined}
            tabIndex={b.url ? 0 : undefined}
            aria-label={b.url ? `Opne ${b.org} på Instagram` : undefined}
            onMouseEnter={() => setHov(true)}
            onMouseLeave={() => setHov(false)}
            onClick={() => {
              if (suppressClickRef.current) { suppressClickRef.current = false; return; }
              if (b.url) window.open(b.url, '_blank', 'noopener');
            }}
            onKeyDown={(ev) => { if (b.url && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); window.open(b.url, '_blank', 'noopener'); } }}
            style={{
              width: '100%', height: '100%', borderRadius: '50%',
              background: hov ? b.color : `${b.color}18`,
              border: `2px solid ${b.color}${hov ? 'ff' : '60'}`,
              display: 'flex', flexDirection: 'column',
              alignItems: 'center', justifyContent: 'center',
              padding: Math.round(24 * scale), textAlign: 'center',
              transform: hov ? 'scale(1.08)' : 'scale(1)',
              cursor: b.url ? 'pointer' : 'default',
              transition: 'background 0.4s, border-color 0.4s, transform 0.4s cubic-bezier(.16,1,.3,1)',
            }}
          >
            <p style={{ fontSize: Math.max(9, Math.round(10 * scale)), letterSpacing: '0.12em', textTransform: 'uppercase', fontWeight: 700,
              color: hov ? 'rgba(255,255,255,0.7)' : b.color, marginBottom: 6, transition: 'color 0.4s' }}>{b.org}</p>
            <p style={{ fontFamily: tweaks.fontHeading, fontSize: Math.max(13, Math.round((sz > 200 ? 18 : 16) * scale)), fontWeight: 400,
              color: hov ? '#fff' : tweaks.dark, lineHeight: 1.2, marginBottom: 4, transition: 'color 0.4s' }}>{b.role}</p>
            <p style={{ fontSize: Math.max(10, Math.round(11 * scale)), color: hov ? 'rgba(255,255,255,0.65)' : tweaks.dark,
              opacity: hov ? 1 : 0.4, transition: 'all 0.4s' }}>{b.period}</p>
            {hov && <p style={{ fontSize: Math.max(10, Math.round(11 * scale)), color: 'rgba(255,255,255,0.6)', marginTop: 6, lineHeight: 1.4 }}>{b.sub}</p>}
          </div>
        </div>
      );
    }

    function VolunteerBubbles({ tweaks, bp }) {
      const w = bp ? bp.width : 1100;
      const mobile = bp && bp.isMobile;
      // Below 400px the desktop formula used to stay flat at 1 — the vast
      // majority of phones (375–430px) got zero size relief. Ease down
      // continuously instead, steepening as the screen narrows, with a
      // 0.5 floor so text never becomes illegible. Matches the desktop
      // branch exactly at w=400 so there's no visible seam.
      const shrink = Math.min(1, Math.max(0, (400 - w) / 80));
      const scale = w <= 400
        ? 1 - 0.5 * Math.pow(shrink, 0.3)
        : Math.min(1.15, 1 + (w - 400) / 2400);
      const mouseRef = useRef({ x: -9999, y: -9999 });
      useEffect(() => {
        const move = (e) => { mouseRef.current = { x: e.clientX, y: e.clientY }; };
        window.addEventListener('mousemove', move);
        return () => window.removeEventListener('mousemove', move);
      }, []);

      if (mobile) {
        // The desktop x/y canvas was designed for a ~1100px-wide stage and
        // gets cramped on a ~300px-wide phone. Stack the bubbles instead,
        // in reading order, with a gentle left/right stagger so it still
        // reads as "floating" rather than a strict grid — but each bubble
        // gets its own vertical band so nothing overlaps or crowds.
        const containerWidthPx = Math.max(200, w - 48);
        const gap = 26;
        const xPattern = [0.04, 0.32, 0.02, 0.28, 0.08];
        let cursorTop = 6;
        const laidOut = bubbleData.map((b, i) => {
          const sz = Math.round(b.size * scale);
          const maxLeftFrac = Math.max(0, (containerWidthPx - sz) / containerWidthPx);
          const leftFrac = Math.min(xPattern[i % xPattern.length], maxLeftFrac);
          const left = Math.round(leftFrac * containerWidthPx);
          const top = cursorTop;
          cursorTop += sz + gap;
          return { b, sz, left, top };
        });
        const containerH = Math.round(cursorTop - gap + 20);
        return (
          <div className="reveal" style={{ position: 'relative', height: containerH, width: '100%' }}>
            {laidOut.map(({ b, sz, left, top }, i) => (
              <BubbleItem
                key={i} b={b} tweaks={tweaks} scale={scale} mouseRef={mouseRef}
                left={`${left}px`} top={`${top}px`} sz={sz}
              />
            ))}
          </div>
        );
      }

      // Container height covers the lowest bubble's bottom edge, whatever the scale.
      const containerH = Math.round(Math.max(
        280 * scale,
        ...bubbleData.map(b => (b.y / 100) * 280 * scale + b.size * scale)
      ) + 24);
      return (
        <div className="reveal" style={{ position: 'relative', height: containerH, width: '100%' }}>
          {bubbleData.map((b, i) => (
            <BubbleItem
              key={i} b={b} tweaks={tweaks} scale={scale} mouseRef={mouseRef}
              left={`${b.x}%`} top={`${b.y}%`} sz={Math.round(b.size * scale)}
            />
          ))}
        </div>
      );
    }

    // Contact
    function Contact({ tweaks, bp }) {
      const mobile = bp && bp.isMobile;
      const btnBase = {
        borderRadius: 100, textDecoration: 'none', fontSize: 15, fontWeight: 500,
        transition: 'transform 0.2s, opacity 0.2s, border-color 0.2s',
        display: 'block', textAlign: 'center',
        padding: mobile ? '14px 24px' : '16px 40px',
        width: mobile ? '100%' : 'auto',
      };
      const emailEnter = e => {
        e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.opacity = '0.9';
        const plane = e.currentTarget.querySelector('.paper-plane');
        const trail = e.currentTarget.querySelector('.paper-plane-trail');
        const trailMask = e.currentTarget.querySelector('.paper-plane-trail-mask');
        const ease = 'cubic-bezier(.45,.05,.35,1)';
        const trailDelay = '0.15s';
        if (plane) { plane.style.animation = 'none'; void plane.offsetWidth; plane.style.animation = `paperPlaneFly 3s ${ease} forwards`; }
        if (trail) { trail.style.animation = 'none'; void trail.offsetWidth; trail.style.animation = `paperTrailFade 3s ${ease} ${trailDelay} forwards`; }
        if (trailMask) { trailMask.style.animation = 'none'; void trailMask.offsetWidth; trailMask.style.animation = `paperTrailReveal 3s ${ease} ${trailDelay} forwards`; }
      };
      const emailLeave = e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.opacity = '1'; };
      const emailTouchRef = useTouchHoverStyle(emailEnter, emailLeave);
      const cvEnter = e => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.borderColor = tweaks.bg; e.currentTarget.style.background = tweaks.bg; e.currentTarget.style.color = tweaks.dark; };
      const cvLeave = e => { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.borderColor = tweaks.bg+'30'; e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = tweaks.bg; };
      const cvTouchRef = useTouchHoverStyle(cvEnter, cvLeave);
      const linkedinEnter = e => { e.currentTarget.style.opacity = '1'; e.currentTarget.style.transform = 'translateY(-2px)'; };
      const linkedinLeave = e => { e.currentTarget.style.opacity = '0.65'; e.currentTarget.style.transform = 'translateY(0)'; };
      const linkedinTouchRef = useTouchHoverStyle(linkedinEnter, linkedinLeave);
      const githubEnter = e => { e.currentTarget.style.opacity = '1'; e.currentTarget.style.transform = 'translateY(-2px)'; };
      const githubLeave = e => { e.currentTarget.style.opacity = '0.65'; e.currentTarget.style.transform = 'translateY(0)'; };
      const githubTouchRef = useTouchHoverStyle(githubEnter, githubLeave);
      return (
        <section id="kontakt" style={{ padding: mobile ? '72px 24px' : `${80 * tweaks.spacing}px 48px`, background: tweaks.dark, color: tweaks.bg, minHeight: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
          <div style={{ maxWidth: 800, margin: '0 auto', width: '100%', textAlign: 'center' }}>
            <p className="reveal" style={{ fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: tweaks.accent, marginBottom: 20, fontWeight: 500 }}>La oss snakke</p>
            <h2 className="reveal reveal-delay-1" style={{
              fontFamily: tweaks.fontHeading, fontSize: mobile ? 'clamp(36px, 11vw, 56px)' : 'clamp(48px, 7vw, 96px)',
              lineHeight: 1.05, letterSpacing: '-0.03em', fontWeight: 400, marginBottom: mobile ? 20 : 32
            }}>
              Trenger du min<br/>
              <span style={{ fontStyle: 'italic', color: tweaks.accent }}>kompetanse?</span>
            </h2>
            <p className="reveal reveal-delay-2" style={{ fontSize: mobile ? 15 : 18, opacity: 0.6, lineHeight: 1.7, marginBottom: mobile ? 40 : 64, fontWeight: 300 }}>
              Åpen for samarbeid, jobb eller internship innanfor design og utvikling.
            </p>

            <div className="reveal reveal-delay-3" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: mobile ? 12 : 16, marginBottom: mobile ? 40 : 80 }}>
              <div style={{ display: 'flex', flexDirection: mobile ? 'column' : 'row', alignItems: 'center', gap: mobile ? 12 : 16 }}>
              <a href="mailto:olinefk@outlook.com" ref={emailTouchRef} style={{
                position: 'relative', overflow: 'visible',
                background: tweaks.accent, color: '#fff', padding: mobile ? '15px 32px' : '16px 56px',
                borderRadius: 100, textDecoration: 'none', fontSize: 15, fontWeight: 500,
                whiteSpace: 'nowrap',
                transition: 'transform 0.2s, opacity 0.2s', display: 'inline-block', width: mobile ? '100%' : 'auto', textAlign: 'center'
              }}
                onMouseEnter={emailEnter}
                onMouseLeave={emailLeave}
              >
                <span>✉ Send e-post</span>
                {!mobile && (
                  <div style={{ position: 'absolute', top: '50%', right: '100%', width: 140, height: 100, transform: 'translateY(-50%)', pointerEvents: 'none' }}>
                    <svg viewBox="0 0 140 100" width="140" height="100" style={{ position: 'absolute', top: 0, left: 0, overflow: 'visible' }}>
                      <defs>
                        <mask id="paperTrailMask" maskUnits="userSpaceOnUse" x="0" y="0" width="140" height="100">
                          <path className="paper-plane-trail-mask"
                            d="M138,52 C108,15 62,10 40,32 C18,54 30,78 58,74 C82,70 84,46 62,40 C46,35 30,24 18,12"
                            fill="none" stroke="#fff" strokeWidth="14" strokeLinecap="round"
                            strokeDasharray="100 100" pathLength="100"
                            style={{ strokeDashoffset: 100 }} />
                        </mask>
                      </defs>
                      {/* Always fully "drawn" with a small dash texture — the mask above reveals
                          only the portion behind the plane, so the stripes never appear ahead of it. */}
                      <path className="paper-plane-trail"
                        d="M138,52 C108,15 62,10 40,32 C18,54 30,78 58,74 C82,70 84,46 62,40 C46,35 30,24 18,12"
                        fill="none" stroke="#fff" strokeWidth="1.5" strokeLinecap="round"
                        strokeDasharray="6 6" mask="url(#paperTrailMask)"
                        style={{ opacity: 0 }} />
                    </svg>
                    <svg className="paper-plane" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width="16" height="16"
                      style={{
                        position: 'absolute', top: 0, left: 0, marginTop: -8, marginLeft: -8, opacity: 0,
                        offsetPath: 'path("M138,52 C108,15 62,10 40,32 C18,54 30,78 58,74 C82,70 84,46 62,40 C46,35 30,24 18,12")',
                        offsetRotate: 'auto', offsetDistance: '0%'
                      }}>
                      <line x1="22" y1="2" x2="11" y2="13"></line>
                      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                  </div>
                )}
              </a>

              <a href="uploads/Oline_Kleiven_CV.pdf" download="Oline_Kleiven_CV.pdf" ref={cvTouchRef} style={{
                background: 'transparent', color: tweaks.bg, padding: mobile ? '13px 32px' : '14px 56px',
                borderRadius: 100, textDecoration: 'none', fontSize: 14, fontWeight: 400,
                whiteSpace: 'nowrap',
                border: `1.5px solid ${tweaks.bg}30`, transition: 'transform 0.2s, border-color 0.2s, background 0.2s, color 0.2s',
                display: 'inline-block', width: mobile ? '100%' : 'auto', textAlign: 'center'
              }}
                onMouseEnter={cvEnter}
                onMouseLeave={cvLeave}
              >↓ Last ned CV</a>
              </div>

              <div style={{ display: 'flex', gap: 32, marginTop: mobile ? 8 : 12 }}>
                <a href="https://www.linkedin.com/in/oline-kleiven-99852b264/" target="_blank" rel="noopener" ref={linkedinTouchRef} style={{
                  color: tweaks.bg, textDecoration: 'none', fontSize: 14, fontWeight: 400,
                  opacity: 0.65, transition: 'opacity 0.2s, transform 0.2s', letterSpacing: '0.02em'
                }}
                  onMouseEnter={linkedinEnter}
                  onMouseLeave={linkedinLeave}
                >LinkedIn ↗</a>
                <a href="https://github.com/olinekleiven" target="_blank" rel="noopener" ref={githubTouchRef} style={{
                  color: tweaks.bg, textDecoration: 'none', fontSize: 14, fontWeight: 400,
                  opacity: 0.65, transition: 'opacity 0.2s, transform 0.2s', letterSpacing: '0.02em'
                }}
                  onMouseEnter={githubEnter}
                  onMouseLeave={githubLeave}
                >GitHub ↗</a>
              </div>
            </div>

            <div style={{ borderTop: `1px solid ${tweaks.bg}15`, paddingTop: 32, display: 'flex', flexDirection: mobile ? 'column' : 'row', justifyContent: 'space-between', alignItems: 'center', gap: mobile ? 6 : 0, fontSize: 13, opacity: 0.6 }}>
              <span>Oline Flatabø Kleiven</span>
              <span>olinefk@outlook.com</span>
              <span>Bergen, Norge</span>
            </div>
          </div>
        </section>
      );
    }

    // Tweaks Panel
    function TweaksPanel({ tweaks, setTweaks, open }) {
      const update = (key, val) => {
        const next = { ...tweaks, [key]: val };
        setTweaks(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
      };
      return (
        <div id="tweaks-panel" className={open ? 'open' : ''}>
          <h4>Tweaks</h4>
          <div className="tweak-row"><label>Accentfarge</label><input type="color" value={tweaks.accent} onChange={e => update('accent', e.target.value)} /></div>
          <div className="tweak-row"><label>Bakgrunn</label><input type="color" value={tweaks.bg} onChange={e => update('bg', e.target.value)} /></div>
          <div className="tweak-row"><label>Skrift</label>
            <select value={tweaks.fontHeading} onChange={e => update('fontHeading', e.target.value)}>
              <option>DM Serif Display</option>
              <option>Playfair Display</option>
              <option>Georgia</option>
            </select>
          </div>
          <div className="tweak-row"><label>Romlighet</label><input type="range" min="0.7" max="1.4" step="0.1" value={tweaks.spacing} onChange={e => update('spacing', parseFloat(e.target.value))} /></div>
        </div>
      );
    }

    function App() {
      const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
      const [tweaksOpen, setTweaksOpen] = useState(false);
      const bp = useBreakpoint();
      useReveal();

      useEffect(() => {
        window.addEventListener('message', (e) => {
          if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
          if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
        });
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
      }, []);

      useEffect(() => {
        document.documentElement.style.setProperty('--accent', tweaks.accent);
        document.documentElement.style.setProperty('--bg', tweaks.bg);
      }, [tweaks]);

      return (
        <>
          <Cursor />
          <Nav tweaks={tweaks} bp={bp} />
          <Hero tweaks={tweaks} bp={bp} />
          <AboutMe tweaks={tweaks} bp={bp} />
          <Education tweaks={tweaks} bp={bp} />
          <Experience tweaks={tweaks} bp={bp} />
          <Projects tweaks={tweaks} bp={bp} />
          <Skills tweaks={tweaks} bp={bp} />
          <Volunteer tweaks={tweaks} bp={bp} />
          <Contact tweaks={tweaks} bp={bp} />
          <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} open={tweaksOpen} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
